<script>
  // Theme bootstrap — inline + synchronous + ABOVE stylesheets. Values:
  // 'light' | 'dark' (gd_v9_theme); anything else follows the system
  // preference. Sync with src/ui/themeToggle.js.
  (function () {
    var t = null;
    try { t = localStorage.getItem('gd_v9_theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<script type="module">
import { getPlayer, getPlayStyleLabel } from '/src/api/playerApi.js';
import { mountThemeToggle } from '/src/ui/themeToggle.js';
import { on as onEvent } from '/src/core/events.js';
mountThemeToggle(document.getElementById('themeToggleMount'));
import { ACHIEVEMENTS, ACHIEVEMENT_COUNT } from '/src/stats/achievements.js';
import { Chart, registerables } from 'chart.js';
import { renderProfileAvatar } from '/src/player/photoRenderer.js';
import { showEditModal, initializeEditModal } from '/src/player/playerEditModal.js';
import { escapeHtml } from '/src/core/utils.js';
import { CURRENT_HONOR_TITLES, normalizeHonorCounter } from '/shared/honorCatalog.js';

Chart.register(...registerables);

// Read design tokens at chart-build time (canvas can't resolve CSS vars).
// Charts re-render on theme:changed so both modes get correct colors.
function tok(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
function chartPalette() {
  return {
    accent: tok('--accent', '#15694B'),
    accentSoft: tok('--accent-soft', 'rgba(21,105,75,0.10)'),
    win: tok('--win', '#15694B'),
    blue: tok('--team-blue', '#2A5DB0'),
    danger: tok('--danger', '#B6403B'),
    surface: tok('--surface', '#FFFFFF'),
    surface2: tok('--surface-2', '#ECEFEA'),
    ink: tok('--ink', '#1B221E'),
    inkDim: tok('--ink-dim', '#5A655E'),
    inkDimmer: tok('--ink-dimmer', '#8A948D'),
    rule: tok('--rule', 'rgba(27,34,30,0.12)'),
    ruleSoft: tok('--rule-soft', 'rgba(27,34,30,0.07)')
  };
}

function toFiniteNumber(value, fallback = 0) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

function formatInteger(value, fallback = 0) {
  return String(Math.round(toFiniteNumber(value, fallback)));
}

function formatFixed(value, digits = 2, fallback = 0) {
  return toFiniteNumber(value, fallback).toFixed(digits);
}

function formatPercent(value, digits = 1) {
  return formatFixed(toFiniteNumber(value, 0) * 100, digits);
}

function clampNumber(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function normalizeCount(value) {
  return Math.max(0, Math.round(toFiniteNumber(value, 0)));
}

function normalizeRate(value, fallback = 0) {
  return clampNumber(toFiniteNumber(value, fallback), 0, 1);
}

function formatRatePercent(value) {
  return formatFixed(normalizeRate(value) * 100, 1);
}

function normalizeRelationshipStatsMap(statsMap) {
  if (!statsMap || typeof statsMap !== 'object' || Array.isArray(statsMap)) {
    return [];
  }

  return Object.entries(statsMap)
    .map(([handle, rawStats]) => {
      const stats = rawStats && typeof rawStats === 'object' && !Array.isArray(rawStats)
        ? rawStats
        : {};
      const games = normalizeCount(stats.games);
      const wins = Math.min(games, normalizeCount(stats.wins));
      const inferredWinRate = games > 0 ? wins / games : 0;
      return {
        handle: String(handle),
        games,
        wins,
        winRate: normalizeRate(stats.winRate, inferredWinRate)
      };
    })
    .filter(entry => entry.handle.trim().length > 0);
}

function formatDuration(seconds) {
  const safeSeconds = Math.max(0, toFiniteNumber(seconds, 0));
  if (!safeSeconds) return '0分钟';
  const hours = Math.floor(safeSeconds / 3600);
  const mins = Math.floor((safeSeconds % 3600) / 60);
  if (hours > 0) return `${hours}小时${mins}分`;
  return `${mins}分钟`;
}

function renderPartnerRivalStats(player) {
  const partnerStats = normalizeRelationshipStatsMap(player.stats?.partners)
    .sort((a, b) => b.winRate - a.winRate);
  const opponentStats = normalizeRelationshipStatsMap(player.stats?.opponents)
    .sort((a, b) => a.winRate - b.winRate);

  if (partnerStats.length === 0 && opponentStats.length === 0) return '';

  const bestPartner    = partnerStats[0] || null;
  const worstPartner   = partnerStats.length > 1 ? partnerStats[partnerStats.length - 1] : null;
  const hardestOpponent = opponentStats[0] || null;
  const easiestOpponent = opponentStats.length > 1 ? opponentStats[opponentStats.length - 1] : null;

  function relRow(handle, winRate, label, colorClass) {
    const pct = formatRatePercent(winRate);
    return `<div
      class="rels-row"
      role="link"
      tabindex="0"
      data-profile-handle="${escapeHtml(handle)}"
    >
      <div class="rels-row-avatar">👤</div>
      <div class="rels-row-body">
        <div class="rels-row-name">${escapeHtml(label)}</div>
        <div class="rels-row-handle">@${escapeHtml(handle)}</div>
      </div>
      <div class="rels-row-bar-wrap">
        <div class="rels-row-pct">${pct}%</div>
        <div class="rels-row-bar">
          <div class="rels-row-bar-fill ${escapeHtml(colorClass)}" style="width:${pct}%;"></div>
        </div>
      </div>
    </div>`;
  }

  return `
    <div class="section-rule" style="margin-top:var(--s5);">
      <span class="section-rule__bar"></span>
      <span class="section-rule__label">队友与对手</span>
      <span class="section-rule__line"></span>
      <span class="section-rule__meta" style="display:inline">点击查看资料</span>
    </div>
    <div class="card">
      <div class="rels-grid">
        <div>
          <div class="rels-col-title">队友 (${partnerStats.length})</div>
          ${bestPartner ? relRow(bestPartner.handle, bestPartner.winRate, '大佬带我躺赢', 'rels-row-bar-fill--win') : ''}
          ${worstPartner && worstPartner.handle !== bestPartner?.handle
              ? relRow(worstPartner.handle, worstPartner.winRate, '偷着乐吧', 'rels-row-bar-fill--loss') : ''}
        </div>
        <div>
          <div class="rels-col-title">对手 (${opponentStats.length})</div>
          ${hardestOpponent ? relRow(hardestOpponent.handle, hardestOpponent.winRate, '既生瑜何生亮', 'rels-row-bar-fill--loss') : ''}
          ${easiestOpponent && easiestOpponent.handle !== hardestOpponent?.handle
              ? relRow(easiestOpponent.handle, easiestOpponent.winRate, '这是送分来的', 'rels-row-bar-fill--win') : ''}
        </div>
      </div>

      ${partnerStats.length > 0 ? `
        <div class="section-rule" style="margin-top:var(--s5);">
          <span class="section-rule__bar"></span>
          <span class="section-rule__label">所有队友</span>
          <span class="section-rule__line"></span>
        </div>
        <div class="chart-sort-row">
          <span class="chart-sort-label">排序方式</span>
          <select id="partnerSort" class="chart-sort-select">
            <option value="winrate">按胜率</option>
            <option value="games">按场次</option>
            <option value="wins">按胜场</option>
          </select>
        </div>
        <div class="chart-wrap">
          <canvas id="partnersChart" style="max-height:400px;"></canvas>
        </div>
      ` : ''}

      ${opponentStats.length > 0 ? `
        <div class="section-rule" style="margin-top:var(--s5);">
          <span class="section-rule__bar"></span>
          <span class="section-rule__label">所有对手</span>
          <span class="section-rule__line"></span>
        </div>
        <div class="chart-sort-row">
          <span class="chart-sort-label">排序方式</span>
          <select id="opponentSort" class="chart-sort-select">
            <option value="winrate">按胜率</option>
            <option value="games">按场次</option>
            <option value="wins">按胜场</option>
          </select>
        </div>
        <div class="chart-wrap">
          <canvas id="opponentsChart" style="max-height:400px;"></canvas>
        </div>
      ` : ''}
    </div>
  `;
}

function viewProfile(handle) {
  window.location.href = '/player-profile.html?handle=' + encodeURIComponent(handle);
}

function viewRoom(roomCode) {
  if (!roomCode || roomCode === 'LOCAL') return;
  window.location.href = '/?room=' + encodeURIComponent(roomCode);
}

const profileContent = document.getElementById('profileContent');

if (profileContent) {
  profileContent.addEventListener('click', (event) => {
    const profileRow = event.target.closest('[data-profile-handle]');
    if (profileRow && profileContent.contains(profileRow)) {
      viewProfile(profileRow.dataset.profileHandle || '');
      return;
    }

    const gameRow = event.target.closest('[data-room-code]');
    if (gameRow && profileContent.contains(gameRow)) {
      viewRoom(gameRow.dataset.roomCode || '');
    }
  });

  profileContent.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;

    const profileRow = event.target.closest('[data-profile-handle]');
    if (profileRow && profileContent.contains(profileRow)) {
      event.preventDefault();
      viewProfile(profileRow.dataset.profileHandle || '');
      return;
    }

    const gameRow = event.target.closest('[data-room-code]');
    if (gameRow && profileContent.contains(gameRow)) {
      event.preventDefault();
      viewRoom(gameRow.dataset.roomCode || '');
    }
  });
}

// Store chart instances
let recentRankingsChartInstance = null;

function renderRecentRankingsChart(recentRankings) {
  const canvas = document.getElementById('recentRankingsChart');
  if (!canvas || !recentRankings || recentRankings.length === 0) return;

  if (recentRankingsChartInstance) {
    recentRankingsChartInstance.destroy();
    recentRankingsChartInstance = null;
  }

  const rankings = [...recentRankings].reverse();
  const pal = chartPalette();
  recentRankingsChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: rankings.map((_, i) => `第${i + 1}场`),
      datasets: [{
        label: '排名',
        data: rankings,
        borderColor: pal.accent,
        backgroundColor: pal.accentSoft,
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: rankings.map(r => r === 1 ? pal.win : r <= 3 ? pal.blue : pal.danger),
        pointBorderColor: pal.surface,
        pointBorderWidth: 2,
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2.5,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: (ctx) => `排名: #${ctx.parsed.y}` },
          backgroundColor: pal.surface2,
          padding: 10,
          titleColor: pal.ink,
          bodyColor: pal.inkDim,
          borderColor: pal.rule,
          borderWidth: 1
        }
      },
      scales: {
        y: {
          reverse: true,
          min: 1, max: 8,
          ticks: { stepSize: 1, color: pal.inkDimmer, callback: (v) => '#' + v },
          grid: { color: pal.ruleSoft, drawBorder: false }
        },
        x: {
          ticks: { color: pal.inkDimmer, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 },
          grid: { display: false }
        }
      },
      interaction: { intersect: false, mode: 'index' }
    }
  });
}

function renderPartnersChart(stats, sortBy) {
  const canvas = document.getElementById('partnersChart');
  if (!canvas) return;

  let sorted = [...stats];
  if (sortBy === 'games') sorted.sort((a, b) => b.games - a.games);
  else if (sortBy === 'wins') sorted.sort((a, b) => b.wins - a.wins);
  else sorted.sort((a, b) => b.winRate - a.winRate);

  if (window.partnersChartInstance) window.partnersChartInstance.destroy();
  const pal = chartPalette();
  window.partnersChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: sorted.map(p => `@${p.handle}`),
      datasets: [{
        label: '胜率',
        data: sorted.map(p => Number(formatRatePercent(p.winRate))),
        backgroundColor: sorted.map(p =>
          p.winRate >= 0.6 ? pal.win : p.winRate >= 0.5 ? pal.blue : pal.danger),
        borderColor: sorted.map(p =>
          p.winRate >= 0.6 ? pal.win : p.winRate >= 0.5 ? pal.blue : pal.danger),
        borderWidth: 1
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      onClick: (_, elements) => {
        if (elements.length > 0) viewProfile(sorted[elements[0].index].handle);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const d = sorted[ctx.dataIndex];
              return [`胜率: ${ctx.parsed.x}%`, `场次: ${d.games}场`, `胜场: ${d.wins}胜`];
            }
          },
          backgroundColor: pal.surface2, padding: 12,
          titleColor: pal.ink, bodyColor: pal.inkDim,
          borderColor: pal.rule, borderWidth: 1
        }
      },
      scales: {
        x: {
          min: 0, max: 100,
          ticks: { color: pal.inkDimmer, callback: (v) => v + '%' },
          grid: { color: pal.ruleSoft, drawBorder: false }
        },
        y: {
          ticks: { color: pal.inkDimmer, font: { size: sorted.length > 10 ? 10 : 12 }, autoSkip: false, maxRotation: 0 },
          grid: { display: false }
        }
      }
    }
  });
}

function renderOpponentsChart(stats, sortBy) {
  const canvas = document.getElementById('opponentsChart');
  if (!canvas) return;

  let sorted = [...stats];
  if (sortBy === 'games') sorted.sort((a, b) => b.games - a.games);
  else if (sortBy === 'wins') sorted.sort((a, b) => b.wins - a.wins);
  else sorted.sort((a, b) => a.winRate - b.winRate);

  if (window.opponentsChartInstance) window.opponentsChartInstance.destroy();
  const pal = chartPalette();
  window.opponentsChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: sorted.map(p => `@${p.handle}`),
      datasets: [{
        label: '对手胜率',
        data: sorted.map(p => Number(formatRatePercent(p.winRate))),
        backgroundColor: sorted.map(p =>
          p.winRate <= 0.4 ? pal.win : p.winRate <= 0.5 ? pal.blue : pal.danger),
        borderColor: sorted.map(p =>
          p.winRate <= 0.4 ? pal.win : p.winRate <= 0.5 ? pal.blue : pal.danger),
        borderWidth: 1
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      onClick: (_, elements) => {
        if (elements.length > 0) viewProfile(sorted[elements[0].index].handle);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const d = sorted[ctx.dataIndex];
              return [`你的胜率: ${ctx.parsed.x}%`, `场次: ${d.games}场`, `胜场: ${d.wins}胜`];
            }
          },
          backgroundColor: pal.surface2, padding: 12,
          titleColor: pal.ink, bodyColor: pal.inkDim,
          borderColor: pal.rule, borderWidth: 1
        }
      },
      scales: {
        x: {
          min: 0, max: 100,
          ticks: { color: pal.inkDimmer, callback: (v) => v + '%' },
          grid: { color: pal.ruleSoft, drawBorder: false }
        },
        y: {
          ticks: { color: pal.inkDimmer, font: { size: sorted.length > 10 ? 10 : 12 }, autoSkip: false, maxRotation: 0 },
          grid: { display: false }
        }
      }
    }
  });
}

function setupPartnerRivalHandlers(player) {
  const partnerStats = normalizeRelationshipStatsMap(player.stats?.partners)
    .sort((a, b) => b.winRate - a.winRate);
  const opponentStats = normalizeRelationshipStatsMap(player.stats?.opponents)
    .sort((a, b) => a.winRate - b.winRate);

  window.partnerStatsData  = partnerStats;
  window.opponentStatsData = opponentStats;

  const partnerSort = document.getElementById('partnerSort');
  if (partnerSort) {
    partnerSort.addEventListener('change', (e) => renderPartnersChart(window.partnerStatsData, e.target.value));
  }
  const opponentSort = document.getElementById('opponentSort');
  if (opponentSort) {
    opponentSort.addEventListener('change', (e) => renderOpponentsChart(window.opponentStatsData, e.target.value));
  }
}

// Read handle from URL
const urlParams = new URLSearchParams(window.location.search);
const handle = urlParams.get('handle');

if (!handle) {
  document.getElementById('profileContent').innerHTML = `
    <div class="card" style="text-align:center;padding:var(--s8);">
      <div style="font-size:12px;letter-spacing:1px;color:var(--loss);margin-bottom:var(--s4);">出错了</div>
      <div style="font-weight:700;font-size:24px;color:var(--ink);margin-bottom:var(--s4);">缺少玩家参数</div>
      <p style="color:var(--ink-dim);">URL 中需要 <code>?handle=xxx</code> 参数</p>
      <p style="margin-top:var(--s5);"><a href="/players.html" class="btn-primary" style="text-decoration:none;">浏览所有玩家</a></p>
    </div>
  `;
} else {
  loadProfile(handle);
  // Charts bake token colors at build time — rebuild on theme toggle so
  // both light/dark modes render with the right palette.
  onEvent('theme:changed', () => loadProfile(handle));
}

async function loadProfile(handle) {
  try {
    const result = await getPlayer(handle);
    const player = result.player;

    console.log('Player data loaded:', {
      handle: player.handle,
      hasStats4P: !!player.stats.stats4P,
      hasStats8P: !!player.stats.stats8P,
      stats8P_sessions: player.stats.stats8P?.sessionsPlayed,
      modeBreakdown: player.stats.modeBreakdown
    });

    // Populate static hero
    const heroAvatar = document.getElementById('heroAvatar');
    if (heroAvatar) heroAvatar.innerHTML = renderProfileAvatar(player, 120, { marginRight: false, borderWidth: 0 });
    const heroName = document.getElementById('heroName');
    if (heroName) heroName.textContent = player.displayName;
    const heroHandle = document.getElementById('heroHandle');
    if (heroHandle) heroHandle.textContent = '@' + player.handle;
    const heroTagline = document.getElementById('heroTagline');
    if (heroTagline && player.tagline) heroTagline.textContent = '“' + player.tagline + '”';
    const heroStyleBadge = document.getElementById('heroStyleBadge');
    if (heroStyleBadge) heroStyleBadge.textContent = getPlayStyleLabel(player.playStyle);
    const heroFormBadge = document.getElementById('heroFormBadge');
    if (heroFormBadge) {
      const sessions = player.stats.sessionsPlayed || 0;
      heroFormBadge.textContent = sessions > 0 ? '已打 ' + sessions + ' 场' : '新玩家';
    }
    const profileHero = document.getElementById('profileHero');
    if (profileHero) profileHero.style.display = 'grid';

    const normalizedHonors = normalizeHonorCounter(player.stats?.honors || {});
    const earnedHonors = CURRENT_HONOR_TITLES
      .map(honor => [honor, normalizedHonors[honor] || 0])
      .filter(([_, count]) => count > 0)
      .sort((a, b) => b[1] - a[1]);
    const topHonors = earnedHonors.slice(0, 8);
    const totalHonorCount = earnedHonors.reduce((sum, [_, count]) => sum + count, 0);
    const lockedHonorCount = CURRENT_HONOR_TITLES
      .filter(honor => normalizedHonors[honor] === 0)
      .length;

    // Build main content HTML
    const recentRankingsSection = (player.stats.recentRankings && player.stats.recentRankings.length > 0) ? `
      <div class="section-rule" style="margin-top:var(--s5);">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">近期排名走势</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta" style="display:inline">近 ${player.stats.recentRankings.length} 场</span>
      </div>
      <div class="card">
        <div class="chart-wrap">
          <canvas id="recentRankingsChart"></canvas>
        </div>
      </div>
    ` : '';

    const honorsSection = `
      <div class="section-rule" style="margin-top:var(--s5);">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">荣誉</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta" style="display:inline">共 ${totalHonorCount} 项</span>
      </div>
      <div class="card">
        ${topHonors.length > 0 ? `
          <div class="profile-honor-grid">
            ${topHonors.map(([honor, count]) =>
              `<div class="profile-honor-card">
                <div class="ph-icon">🏆</div>
                <div class="ph-body">
                  <div class="ph-name">${escapeHtml(honor)}</div>
                  <div class="ph-count">&times; ${count}</div>
                </div>
              </div>`
            ).join('')}
          </div>
          ${lockedHonorCount > 0
            ? `<p class="small muted" style="margin-top:var(--s4);">+ ${lockedHonorCount} 个荣誉待解锁</p>`
            : ''}
        ` : '<p class="small muted" style="padding:var(--s4) 0;">暂无荣誉，继续加油！</p>'}
      </div>
    `;

    const achievementsSection = `
      <div class="section-rule" style="margin-top:var(--s5);">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">成就</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta" style="display:inline">${player.achievements ? player.achievements.length : 0} / ${ACHIEVEMENT_COUNT}</span>
      </div>
      <div class="card">
        ${player.achievements && player.achievements.length > 0 ? `
          <div class="achievements-grid">
            ${player.achievements.map(achId => {
              const ach = ACHIEVEMENTS[achId];
              return ach ? `
                <div class="achievement-card">
                  <div class="ach-badge">${ach.badge}</div>
                  <div class="ach-name">${escapeHtml(ach.name)}</div>
                  <div class="ach-desc">${escapeHtml(ach.desc)}</div>
                </div>` : '';
            }).join('')}
          </div>
        ` : '<p class="small muted" style="padding:var(--s4) 0;">暂无成就，开始游戏解锁徽章！</p>'}
      </div>
    `;

    const recentGamesSection = `
      <div class="section-rule" style="margin-top:var(--s5);">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">最近游戏</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta" style="display:inline">${player.recentGames.length} 条</span>
      </div>
      <div class="card">
        ${player.recentGames.length > 0 ? `<div>
          ${player.recentGames.slice(0, 10).map(game => `
            <div
              class="recent-game-row"
              role="${game.roomCode && game.roomCode !== 'LOCAL' ? 'link' : 'listitem'}"
              ${game.roomCode && game.roomCode !== 'LOCAL' ? 'tabindex="0"' : ''}
              data-room-code="${escapeHtml(game.roomCode || '')}"
            >
              <div>
                <div>
                  <span class="game-outcome ${game.teamWon ? 'game-outcome--win' : 'game-outcome--loss'}">
                    ${game.teamWon ? '胜' : '负'}
                  </span>
                  <span class="game-meta">
                    · ${escapeHtml(game.mode)} · 平均${escapeHtml(game.ranking)}名 · ${escapeHtml(game.rounds)}轮
                    ${game.duration ? ' · ' + formatDuration(game.duration) : ''}
                  </span>
                </div>
                <div class="game-meta" style="margin-top:3px;">
                  ${new Date(game.date).toLocaleString('zh-CN')}
                  ${game.roomCode !== 'LOCAL' ? ' · 房间 ' + escapeHtml(game.roomCode) : ''}
                </div>
                ${game.honorsEarned && game.honorsEarned.length > 0
                  ? `<div class="game-honors">${game.honorsEarned.map(h => escapeHtml(h)).join('  ')}</div>`
                  : ''}
              </div>
            </div>
          `).join('')}
        </div>` : '<p class="small muted" style="padding:var(--s4) 0;">暂无游戏记录</p>'}
      </div>
    `;

    document.getElementById('profileContent').innerHTML = `
      <!-- CAREER STATS -->
      <div class="section-rule">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">生涯统计</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta" id="statsTitle" style="display:inline">全部模式</span>
      </div>

      <div class="career-stats-section">
        <div class="stats-header">
          <span class="stats-header-title">场次数据</span>
        </div>
        <div class="career-stats-grid">
          <div class="career-stat-tile">
            <div class="tile-label">游戏场次</div>
            <div class="tile-val" id="statSessions">${formatInteger(player.stats.sessionsPlayed || player.stats.gamesPlayed, 0)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">获胜场次</div>
            <div class="tile-val" id="statWins">${formatInteger(player.stats.sessionsWon || player.stats.wins, 0)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">胜率</div>
            <div class="tile-val" id="statWinRate">${formatPercent(player.stats.sessionWinRate || player.stats.winRate)}<span class="sub">%</span></div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">场均排名</div>
            <div class="tile-val" id="statAvgRank">${formatFixed(player.stats.avgRankingPerSession || player.stats.avgRanking)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">场均局数</div>
            <div class="tile-val" id="statAvgRounds">${formatInteger(player.stats.avgRoundsPerSession, 30)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最长局数</div>
            <div class="tile-val" id="statLongestRounds">${formatInteger(player.stats.longestSessionRounds, 0)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">当前连胜</div>
            <div class="tile-val" id="statCurrentStreak">${formatInteger(player.stats.currentWinStreak, 0)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最长连胜</div>
            <div class="tile-val" id="statWinStreak">${formatInteger(player.stats.longestWinStreak, 0)}</div>
          </div>
        </div>
      </div>

      <div class="career-stats-section" style="margin-top:var(--s3);">
        <div class="stats-header">
          <span class="stats-header-title">单局与时长</span>
        </div>
        <div class="career-stats-grid">
          <div class="career-stat-tile">
            <div class="tile-label">总轮次</div>
            <div class="tile-val" id="statRounds">${formatInteger(player.stats.roundsPlayed, 0)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">局均排名</div>
            <div class="tile-val" id="statAvgRankRound">${formatFixed(player.stats.avgRankingPerRound || player.stats.avgRanking)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">总游戏时长</div>
            <div class="tile-val" id="statTotalTime">${formatDuration(player.stats.totalPlayTimeSeconds)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最长对局</div>
            <div class="tile-val" id="statLongestTime">${formatDuration(player.stats.longestSessionSeconds)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">场均时长</div>
            <div class="tile-val" id="statAvgTime">${formatDuration(player.stats.avgSessionSeconds)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最C得票</div>
            <div class="tile-val" style="color:var(--win);">${formatInteger(player.stats.mvpVotes, 0)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最闹得票</div>
            <div class="tile-val" style="color:var(--loss);">${formatInteger(player.stats.burdenVotes, 0)}</div>
          </div>
        </div>
      </div>

      ${recentRankingsSection}
      ${renderPartnerRivalStats(player)}
      ${honorsSection}
      ${achievementsSection}
      ${recentGamesSection}
    `;

    setupPartnerRivalHandlers(player);
    renderRecentRankingsChart(player.stats.recentRankings);

    if (window.partnerStatsData && window.partnerStatsData.length > 0) {
      renderPartnersChart(window.partnerStatsData, 'winrate');
    }
    if (window.opponentStatsData && window.opponentStatsData.length > 0) {
      renderOpponentsChart(window.opponentStatsData, 'winrate');
    }

    // Edit profile button
    const editBtn = document.getElementById('editProfileBtn');
    if (editBtn && player) {
      editBtn.style.display = '';
      initializeEditModal((updatedPlayer) => {
        console.log('Profile updated:', updatedPlayer);
        window.location.reload();
      });
      editBtn.addEventListener('click', () => showEditModal(player));
    }

    // Mode tab switcher
    const modeTabs = document.querySelectorAll('.mode-tab');
    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const selectedMode = tab.dataset.mode;
        modeTabs.forEach(t => t.classList.toggle('active', t === tab));

        let stats;
        if (selectedMode === 'all') {
          stats = player.stats;
        } else {
          stats = player.stats[`stats${selectedMode}`];
          console.log(`Checking ${selectedMode}:`, {
            exists: !!stats,
            hasSessionsPlayed: stats?.sessionsPlayed !== undefined,
            sessionsValue: stats?.sessionsPlayed,
            fullStats: stats
          });
          if (!stats || stats.sessionsPlayed === undefined) {
            console.log(`No ${selectedMode} data yet - showing zeros`);
            stats = {
              sessionsPlayed: 0, sessionsWon: 0, sessionWinRate: 0,
              avgRankingPerSession: 0, avgRoundsPerSession: 0,
              longestSessionRounds: 0, recentRankings: []
            };
          }
        }

        const statsTitle = document.getElementById('statsTitle');
        if (statsTitle) {
          const modeLabel = { 'all': '全部模式', '4P': '4人模式', '6P': '6人模式', '8P': '8人模式' }[selectedMode];
          statsTitle.textContent = modeLabel;
        }

        document.getElementById('statSessions').textContent = formatInteger(stats.sessionsPlayed || stats.gamesPlayed, 0);
        document.getElementById('statWins').textContent = formatInteger(stats.sessionsWon || stats.wins, 0);
        document.getElementById('statWinRate').textContent = formatPercent(stats.sessionWinRate || stats.winRate) + '%';

        if (selectedMode === 'all' && player.stats.modeBreakdown) {
          const modesPlayed = Object.values(player.stats.modeBreakdown || {}).filter(c => c > 0).length;
          if (modesPlayed > 1) {
            document.getElementById('statAvgRank').textContent = '混合';
            document.getElementById('statAvgRankRound').textContent = '混合';
          } else {
            document.getElementById('statAvgRank').textContent = formatFixed(stats.avgRankingPerSession || stats.avgRanking);
            document.getElementById('statAvgRankRound').textContent = formatFixed(stats.avgRankingPerRound);
          }
        } else {
          document.getElementById('statAvgRank').textContent = formatFixed(stats.avgRankingPerSession || stats.avgRanking);
          document.getElementById('statAvgRankRound').textContent = formatFixed(stats.avgRankingPerRound);
        }

        document.getElementById('statAvgRounds').textContent = selectedMode === 'all'
          ? formatInteger(stats.avgRoundsPerSession, 30)
          : formatInteger(stats.avgRoundsPerSession, 0);
        document.getElementById('statLongestRounds').textContent = formatInteger(stats.longestSessionRounds, 0);
        document.getElementById('statCurrentStreak').textContent = formatInteger(stats.currentWinStreak, 0);
        document.getElementById('statRounds').textContent = formatInteger(stats.roundsPlayed, 0);
        document.getElementById('statWinStreak').textContent = formatInteger(stats.longestWinStreak, 0);
        document.getElementById('statTotalTime').textContent = formatDuration(stats.totalPlayTimeSeconds);
        document.getElementById('statLongestTime').textContent = formatDuration(stats.longestSessionSeconds);
        document.getElementById('statAvgTime').textContent = formatDuration(stats.avgSessionSeconds);

        const chartContainer = document.getElementById('recentRankingsChart')?.closest('.chart-wrap');
        if (stats.recentRankings && stats.recentRankings.length > 0) {
          if (chartContainer) chartContainer.style.display = 'block';
          renderRecentRankingsChart(stats.recentRankings);
        } else {
          if (chartContainer) chartContainer.style.display = 'none';
        }

        console.log(`Switched to ${selectedMode} mode:`, stats);
      });
    });

  } catch (error) {
    console.error('Failed to load profile:', error);
    document.getElementById('profileContent').innerHTML = `
      <div class="card" style="text-align:center;padding:var(--s8);">
        <div style="font-size:12px;letter-spacing:1px;color:var(--loss);margin-bottom:var(--s4);">加载失败</div>
        <div style="font-weight:700;font-size:24px;color:var(--ink);margin-bottom:var(--s4);">无法加载玩家资料</div>
        <p style="color:var(--ink-dim);">${escapeHtml(error.message || '未知错误')}</p>
        <p style="margin-top:var(--s5);"><a href="/players.html" class="btn-primary" style="text-decoration:none;">浏览所有玩家</a></p>
      </div>
    `;
  }
}
</script>
</body>
</html>
