<script type="module">
import { getPlayer, getPlayStyleLabel } from '/src/api/playerApi.js';
import { ACHIEVEMENTS } from '/src/stats/achievements.js';
import { Chart, registerables } from 'chart.js';
import { renderProfileAvatar } from '/src/player/photoRenderer.js';
import { showEditModal, initializeEditModal } from '/src/player/playerEditModal.js';
import { escapeHtml } from '/src/core/utils.js';

Chart.register(...registerables);

function formatDuration(seconds) {
  if (!seconds) return '0分钟';
  const hours = Math.floor(seconds / 3600);
  const mins = Math.floor((seconds % 3600) / 60);
  if (hours > 0) return `${hours}小时${mins}分`;
  return `${mins}分钟`;
}

function renderPartnerRivalStats(player) {
  const partners = player.stats.partners || {};
  const opponents = player.stats.opponents || {};

  if (Object.keys(partners).length === 0 && Object.keys(opponents).length === 0) return '';

  const partnerStats = Object.entries(partners)
    .map(([handle, s]) => ({ handle, ...s }))
    .sort((a, b) => b.winRate - a.winRate);
  const opponentStats = Object.entries(opponents)
    .map(([handle, s]) => ({ handle, ...s }))
    .sort((a, b) => a.winRate - b.winRate);

  const bestPartner    = partnerStats[0] || null;
  const worstPartner   = partnerStats.length > 1 ? partnerStats[partnerStats.length - 1] : null;
  const hardestOpponent = opponentStats[0] || null;
  const easiestOpponent = opponentStats.length > 1 ? opponentStats[opponentStats.length - 1] : null;

  function relRow(handle, winRate, label, colorClass) {
    const pct = (winRate * 100).toFixed(1);
    return `<div class="rels-row" onclick="viewProfile('${escapeHtml(handle)}')">
      <div class="rels-row-avatar">👤</div>
      <div class="rels-row-body">
        <div class="rels-row-name">${escapeHtml(label)}</div>
        <div class="rels-row-handle">@${escapeHtml(handle)}</div>
      </div>
      <div class="rels-row-bar-wrap">
        <div class="rels-row-pct">${pct}%</div>
        <div class="rels-row-bar">
          <div class="rels-row-bar-fill ${escapeHtml(colorClass)}" style="width:${pct}%;"></div>
        </div>
      </div>
    </div>`;
  }

  return `
    <div class="section-rule" style="margin-top:var(--s5);">
      <span class="section-rule__bar"></span>
      <span class="section-rule__label">队友与对手 · Partners &amp; Rivals</span>
      <span class="section-rule__line"></span>
      <span class="section-rule__meta">WIN RATE · CLICK TO VIEW PROFILE</span>
    </div>
    <div class="card">
      <div class="rels-grid">
        <div>
          <div class="rels-col-title">队友 · Partners (${partnerStats.length})</div>
          ${bestPartner ? relRow(bestPartner.handle, bestPartner.winRate, '大佬带我躺赢', 'rels-row-bar-fill--win') : ''}
          ${worstPartner && worstPartner.handle !== bestPartner?.handle
              ? relRow(worstPartner.handle, worstPartner.winRate, '偷着乐吧', 'rels-row-bar-fill--loss') : ''}
        </div>
        <div>
          <div class="rels-col-title">对手 · Opponents (${opponentStats.length})</div>
          ${hardestOpponent ? relRow(hardestOpponent.handle, hardestOpponent.winRate, '既生瑜何生亮', 'rels-row-bar-fill--loss') : ''}
          ${easiestOpponent && easiestOpponent.handle !== hardestOpponent?.handle
              ? relRow(easiestOpponent.handle, easiestOpponent.winRate, '这是送分来的', 'rels-row-bar-fill--win') : ''}
        </div>
      </div>

      ${partnerStats.length > 0 ? `
        <div class="section-rule" style="margin-top:var(--s5);">
          <span class="section-rule__bar"></span>
          <span class="section-rule__label">所有队友 · All Partners</span>
          <span class="section-rule__line"></span>
        </div>
        <div class="chart-sort-row">
          <span class="chart-sort-label">排序方式</span>
          <select id="partnerSort" class="chart-sort-select">
            <option value="winrate">按胜率</option>
            <option value="games">按场次</option>
            <option value="wins">按胜场</option>
          </select>
        </div>
        <div class="chart-wrap">
          <canvas id="partnersChart" style="max-height:400px;"></canvas>
        </div>
      ` : ''}

      ${opponentStats.length > 0 ? `
        <div class="section-rule" style="margin-top:var(--s5);">
          <span class="section-rule__bar"></span>
          <span class="section-rule__label">所有对手 · All Opponents</span>
          <span class="section-rule__line"></span>
        </div>
        <div class="chart-sort-row">
          <span class="chart-sort-label">排序方式</span>
          <select id="opponentSort" class="chart-sort-select">
            <option value="winrate">按胜率</option>
            <option value="games">按场次</option>
            <option value="wins">按胜场</option>
          </select>
        </div>
        <div class="chart-wrap">
          <canvas id="opponentsChart" style="max-height:400px;"></canvas>
        </div>
      ` : ''}
    </div>
  `;
}

function viewProfile(handle) {
  window.location.href = '/player-profile.html?handle=' + encodeURIComponent(handle);
}

// Store chart instances
let recentRankingsChartInstance = null;

function renderRecentRankingsChart(recentRankings) {
  const canvas = document.getElementById('recentRankingsChart');
  if (!canvas || !recentRankings || recentRankings.length === 0) return;

  if (recentRankingsChartInstance) {
    recentRankingsChartInstance.destroy();
    recentRankingsChartInstance = null;
  }

  const rankings = [...recentRankings].reverse();
  recentRankingsChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: rankings.map((_, i) => `第${i + 1}场`),
      datasets: [{
        label: '排名',
        data: rankings,
        borderColor: '#e07a3a',
        backgroundColor: 'rgba(224, 122, 58, 0.08)',
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: rankings.map(r => r === 1 ? '#4a9456' : r <= 3 ? '#4a82d8' : '#cf3a3f'),
        pointBorderColor: '#1c1f29',
        pointBorderWidth: 2,
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2.5,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: (ctx) => `排名: #${ctx.parsed.y}` },
          backgroundColor: 'rgba(19,22,32,0.92)',
          padding: 10,
          titleColor: '#f3f0e9',
          bodyColor: '#adaaa3',
          borderColor: '#444751',
          borderWidth: 1
        }
      },
      scales: {
        y: {
          reverse: true,
          min: 1, max: 8,
          ticks: { stepSize: 1, color: '#76736d', callback: (v) => '#' + v },
          grid: { color: '#393c46', drawBorder: false }
        },
        x: {
          ticks: { color: '#76736d', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 },
          grid: { display: false }
        }
      },
      interaction: { intersect: false, mode: 'index' }
    }
  });
}

function renderPartnersChart(stats, sortBy) {
  const canvas = document.getElementById('partnersChart');
  if (!canvas) return;

  let sorted = [...stats];
  if (sortBy === 'games') sorted.sort((a, b) => b.games - a.games);
  else if (sortBy === 'wins') sorted.sort((a, b) => b.wins - a.wins);
  else sorted.sort((a, b) => b.winRate - a.winRate);

  if (window.partnersChartInstance) window.partnersChartInstance.destroy();
  window.partnersChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: sorted.map(p => `@${p.handle}`),
      datasets: [{
        label: '胜率',
        data: sorted.map(p => (p.winRate * 100).toFixed(1)),
        backgroundColor: sorted.map(p =>
          p.winRate >= 0.6 ? 'rgba(74,148,86,0.8)' :
          p.winRate >= 0.5 ? 'rgba(74,130,216,0.8)' : 'rgba(207,58,63,0.8)'),
        borderColor: sorted.map(p =>
          p.winRate >= 0.6 ? '#4a9456' : p.winRate >= 0.5 ? '#4a82d8' : '#cf3a3f'),
        borderWidth: 1
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      onClick: (_, elements) => {
        if (elements.length > 0) viewProfile(sorted[elements[0].index].handle);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const d = sorted[ctx.dataIndex];
              return [`胜率: ${ctx.parsed.x}%`, `场次: ${d.games}场`, `胜场: ${d.wins}胜`];
            }
          },
          backgroundColor: 'rgba(19,22,32,0.92)', padding: 12,
          titleColor: '#f3f0e9', bodyColor: '#adaaa3',
          borderColor: '#444751', borderWidth: 1
        }
      },
      scales: {
        x: {
          min: 0, max: 100,
          ticks: { color: '#76736d', callback: (v) => v + '%' },
          grid: { color: '#393c46', drawBorder: false }
        },
        y: {
          ticks: { color: '#76736d', font: { size: sorted.length > 10 ? 10 : 12 }, autoSkip: false, maxRotation: 0 },
          grid: { display: false }
        }
      }
    }
  });
}

function renderOpponentsChart(stats, sortBy) {
  const canvas = document.getElementById('opponentsChart');
  if (!canvas) return;

  let sorted = [...stats];
  if (sortBy === 'games') sorted.sort((a, b) => b.games - a.games);
  else if (sortBy === 'wins') sorted.sort((a, b) => b.wins - a.wins);
  else sorted.sort((a, b) => a.winRate - b.winRate);

  if (window.opponentsChartInstance) window.opponentsChartInstance.destroy();
  window.opponentsChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: sorted.map(p => `@${p.handle}`),
      datasets: [{
        label: '对手胜率',
        data: sorted.map(p => (p.winRate * 100).toFixed(1)),
        backgroundColor: sorted.map(p =>
          p.winRate <= 0.4 ? 'rgba(74,148,86,0.8)' :
          p.winRate <= 0.5 ? 'rgba(74,130,216,0.8)' : 'rgba(207,58,63,0.8)'),
        borderColor: sorted.map(p =>
          p.winRate <= 0.4 ? '#4a9456' : p.winRate <= 0.5 ? '#4a82d8' : '#cf3a3f'),
        borderWidth: 1
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      onClick: (_, elements) => {
        if (elements.length > 0) viewProfile(sorted[elements[0].index].handle);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const d = sorted[ctx.dataIndex];
              return [`你的胜率: ${ctx.parsed.x}%`, `场次: ${d.games}场`, `胜场: ${d.wins}胜`];
            }
          },
          backgroundColor: 'rgba(19,22,32,0.92)', padding: 12,
          titleColor: '#f3f0e9', bodyColor: '#adaaa3',
          borderColor: '#444751', borderWidth: 1
        }
      },
      scales: {
        x: {
          min: 0, max: 100,
          ticks: { color: '#76736d', callback: (v) => v + '%' },
          grid: { color: '#393c46', drawBorder: false }
        },
        y: {
          ticks: { color: '#76736d', font: { size: sorted.length > 10 ? 10 : 12 }, autoSkip: false, maxRotation: 0 },
          grid: { display: false }
        }
      }
    }
  });
}

function setupPartnerRivalHandlers(player) {
  const partners  = player.stats.partners  || {};
  const opponents = player.stats.opponents || {};

  const partnerStats = Object.entries(partners)
    .map(([handle, s]) => ({ handle, ...s }))
    .sort((a, b) => b.winRate - a.winRate);
  const opponentStats = Object.entries(opponents)
    .map(([handle, s]) => ({ handle, ...s }))
    .sort((a, b) => a.winRate - b.winRate);

  window.partnerStatsData  = partnerStats;
  window.opponentStatsData = opponentStats;

  const partnerSort = document.getElementById('partnerSort');
  if (partnerSort) {
    partnerSort.addEventListener('change', (e) => renderPartnersChart(window.partnerStatsData, e.target.value));
  }
  const opponentSort = document.getElementById('opponentSort');
  if (opponentSort) {
    opponentSort.addEventListener('change', (e) => renderOpponentsChart(window.opponentStatsData, e.target.value));
  }
}

// Read handle from URL
const urlParams = new URLSearchParams(window.location.search);
const handle = urlParams.get('handle');

if (!handle) {
  document.getElementById('profileContent').innerHTML = `
    <div class="card" style="text-align:center;padding:var(--s8);">
      <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.18em;color:var(--loss);text-transform:uppercase;margin-bottom:var(--s4);">错误 · Error</div>
      <div style="font-family:var(--font-display);font-weight:900;font-size:28px;color:var(--ink);margin-bottom:var(--s4);">缺少玩家参数</div>
      <p style="color:var(--ink-dim);">URL 中需要 <code>?handle=xxx</code> 参数</p>
      <p style="margin-top:var(--s5);"><a href="/players.html" class="btn-primary" style="text-decoration:none;">浏览所有玩家</a></p>
    </div>
  `;
} else {
  loadProfile(handle);
}

async function loadProfile(handle) {
  try {
    const result = await getPlayer(handle);
    const player = result.player;

    console.log('Player data loaded:', {
      handle: player.handle,
      hasStats4P: !!player.stats.stats4P,
      hasStats8P: !!player.stats.stats8P,
      stats8P_sessions: player.stats.stats8P?.sessionsPlayed,
      modeBreakdown: player.stats.modeBreakdown
    });

    // Populate static hero
    const heroAvatar = document.getElementById('heroAvatar');
    if (heroAvatar) heroAvatar.innerHTML = renderProfileAvatar(player, 120, { marginRight: false, borderWidth: 0 });
    const heroName = document.getElementById('heroName');
    if (heroName) heroName.textContent = player.displayName;
    const heroHandle = document.getElementById('heroHandle');
    if (heroHandle) heroHandle.textContent = '@' + player.handle;
    const heroTagline = document.getElementById('heroTagline');
    if (heroTagline && player.tagline) heroTagline.textContent = '“' + player.tagline + '”';
    const heroStyleBadge = document.getElementById('heroStyleBadge');
    if (heroStyleBadge) heroStyleBadge.textContent = getPlayStyleLabel(player.playStyle);
    const heroFormBadge = document.getElementById('heroFormBadge');
    if (heroFormBadge) {
      const sessions = player.stats.sessionsPlayed || 0;
      heroFormBadge.textContent = sessions > 0 ? sessions + ' SESSIONS PLAYED' : 'NEW PLAYER';
    }
    const profileHero = document.getElementById('profileHero');
    if (profileHero) profileHero.style.display = 'grid';

    const topHonors = Object.entries(player.stats.honors)
      .filter(([_, count]) => count > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8);

    // Build main content HTML
    const recentRankingsSection = (player.stats.recentRankings && player.stats.recentRankings.length > 0) ? `
      <div class="section-rule" style="margin-top:var(--s5);">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">近期排名走势 · Recent Performance</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta">LAST ${player.stats.recentRankings.length} SESSIONS</span>
      </div>
      <div class="card">
        <div class="chart-wrap">
          <canvas id="recentRankingsChart"></canvas>
        </div>
      </div>
    ` : '';

    const honorsSection = `
      <div class="section-rule" style="margin-top:var(--s5);">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">荣誉收藏 · Honors Earned</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta">${topHonors.length > 0 ? topHonors.reduce((s, [_, c]) => s + c, 0) : 0} TOTAL</span>
      </div>
      <div class="card">
        ${topHonors.length > 0 ? `
          <div class="profile-honor-grid">
            ${topHonors.map(([honor, count]) =>
              `<div class="profile-honor-card">
                <div class="ph-icon">🏆</div>
                <div class="ph-body">
                  <div class="ph-name">${escapeHtml(honor)}</div>
                  <div class="ph-count">&times; ${count}</div>
                </div>
              </div>`
            ).join('')}
          </div>
          ${Object.keys(player.stats.honors).length > topHonors.length
            ? `<p class="small muted" style="margin-top:var(--s4);">+ ${Object.keys(player.stats.honors).filter(h => player.stats.honors[h] === 0).length} 个荣誉待解锁</p>`
            : ''}
        ` : '<p class="small muted" style="padding:var(--s4) 0;">暂无荣誉，继续加油！</p>'}
      </div>
    `;

    const achievementsSection = `
      <div class="section-rule" style="margin-top:var(--s5);">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">成就徽章 · Achievements</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta">${player.achievements ? player.achievements.length : 0} / 20 UNLOCKED</span>
      </div>
      <div class="card">
        ${player.achievements && player.achievements.length > 0 ? `
          <div class="achievements-grid">
            ${player.achievements.map(achId => {
              const ach = ACHIEVEMENTS[achId];
              return ach ? `
                <div class="achievement-card">
                  <div class="ach-badge">${ach.badge}</div>
                  <div class="ach-name">${escapeHtml(ach.name)}</div>
                  <div class="ach-desc">${escapeHtml(ach.desc)}</div>
                </div>` : '';
            }).join('')}
          </div>
        ` : '<p class="small muted" style="padding:var(--s4) 0;">暂无成就，开始游戏解锁徽章！</p>'}
      </div>
    `;

    const recentGamesSection = `
      <div class="section-rule" style="margin-top:var(--s5);">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">最近游戏 · Recent Games</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta">${player.recentGames.length} RECORDS</span>
      </div>
      <div class="card">
        ${player.recentGames.length > 0 ? `<div>
          ${player.recentGames.slice(0, 10).map(game => `
            <div class="recent-game-row" onclick="location.href='/?room=${encodeURIComponent(game.roomCode)}'">
              <div>
                <div>
                  <span class="game-outcome ${game.teamWon ? 'game-outcome--win' : 'game-outcome--loss'}">
                    ${game.teamWon ? '胜' : '负'}
                  </span>
                  <span class="game-meta">
                    · ${escapeHtml(game.mode)} · 平均${game.ranking}名 · ${game.rounds}轮
                    ${game.duration ? ' · ' + formatDuration(game.duration) : ''}
                  </span>
                </div>
                <div class="game-meta" style="margin-top:3px;">
                  ${new Date(game.date).toLocaleString('zh-CN')}
                  ${game.roomCode !== 'LOCAL' ? ' · 房间 ' + escapeHtml(game.roomCode) : ''}
                </div>
                ${game.honorsEarned && game.honorsEarned.length > 0
                  ? `<div class="game-honors">${game.honorsEarned.map(h => escapeHtml(h)).join('  ')}</div>`
                  : ''}
              </div>
            </div>
          `).join('')}
        </div>` : '<p class="small muted" style="padding:var(--s4) 0;">暂无游戏记录</p>'}
      </div>
    `;

    document.getElementById('profileContent').innerHTML = `
      <!-- CAREER STATS -->
      <div class="section-rule">
        <span class="section-rule__bar"></span>
        <span class="section-rule__label">生涯统计 · Career Stats</span>
        <span class="section-rule__line"></span>
        <span class="section-rule__meta" id="statsTitle">全部模式 · ALL MODES</span>
      </div>

      <div class="career-stats-section">
        <div class="stats-header">
          <span class="stats-header-title">场次数据 · Sessions</span>
        </div>
        <div class="career-stats-grid">
          <div class="career-stat-tile">
            <div class="tile-label">游戏场次 · Sessions</div>
            <div class="tile-val" id="statSessions">${player.stats.sessionsPlayed || player.stats.gamesPlayed || 0}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">获胜场次 · Won</div>
            <div class="tile-val" id="statWins">${player.stats.sessionsWon || player.stats.wins || 0}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">胜率 · Win Rate</div>
            <div class="tile-val" id="statWinRate">${((player.stats.sessionWinRate || player.stats.winRate || 0) * 100).toFixed(1)}<span class="sub">%</span></div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">场均排名 · Avg Rank</div>
            <div class="tile-val" id="statAvgRank">${(player.stats.avgRankingPerSession || player.stats.avgRanking || 0).toFixed(2)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">场均局数 · Avg Rounds</div>
            <div class="tile-val" id="statAvgRounds">${Math.round(player.stats.avgRoundsPerSession || 30)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最长局数 · Longest</div>
            <div class="tile-val" id="statLongestRounds">${player.stats.longestSessionRounds || 0}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">当前连胜 · Streak</div>
            <div class="tile-val" id="statCurrentStreak">${player.stats.currentWinStreak || 0}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最长连胜 · Best Streak</div>
            <div class="tile-val" id="statWinStreak">${player.stats.longestWinStreak || 0}</div>
          </div>
        </div>
      </div>

      <div class="career-stats-section" style="margin-top:var(--s3);">
        <div class="stats-header">
          <span class="stats-header-title">单局 &amp; 时长 · Rounds &amp; Time</span>
        </div>
        <div class="career-stats-grid">
          <div class="career-stat-tile">
            <div class="tile-label">总轮次 · Rounds</div>
            <div class="tile-val" id="statRounds">${player.stats.roundsPlayed || 0}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">局均排名 · Per-round Rank</div>
            <div class="tile-val" id="statAvgRankRound">${(player.stats.avgRankingPerRound || player.stats.avgRanking || 0).toFixed(2)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">总游戏时长 · Total Time</div>
            <div class="tile-val" id="statTotalTime">${formatDuration(player.stats.totalPlayTimeSeconds || 0)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最长对局 · Longest</div>
            <div class="tile-val" id="statLongestTime">${formatDuration(player.stats.longestSessionSeconds || 0)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">场均时长 · Avg Session</div>
            <div class="tile-val" id="statAvgTime">${formatDuration(player.stats.avgSessionSeconds || 0)}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最C得票 · MVP Votes</div>
            <div class="tile-val" style="color:var(--win);">${player.stats.mvpVotes || 0}</div>
          </div>
          <div class="career-stat-tile">
            <div class="tile-label">最闹得票 · Burden Votes</div>
            <div class="tile-val" style="color:var(--loss);">${player.stats.burdenVotes || 0}</div>
          </div>
        </div>
      </div>

      ${recentRankingsSection}
      ${renderPartnerRivalStats(player)}
      ${honorsSection}
      ${achievementsSection}
      ${recentGamesSection}
    `;

    setupPartnerRivalHandlers(player);
    renderRecentRankingsChart(player.stats.recentRankings);

    if (window.partnerStatsData && window.partnerStatsData.length > 0) {
      renderPartnersChart(window.partnerStatsData, 'winrate');
    }
    if (window.opponentStatsData && window.opponentStatsData.length > 0) {
      renderOpponentsChart(window.opponentStatsData, 'winrate');
    }

    // Edit profile button
    const editBtn = document.getElementById('editProfileBtn');
    if (editBtn && player) {
      editBtn.style.display = '';
      initializeEditModal((updatedPlayer) => {
        console.log('Profile updated:', updatedPlayer);
        window.location.reload();
      });
      editBtn.addEventListener('click', () => showEditModal(player));
    }

    // Mode tab switcher
    const modeTabs = document.querySelectorAll('.mode-tab');
    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const selectedMode = tab.dataset.mode;
        modeTabs.forEach(t => t.classList.toggle('active', t === tab));

        let stats;
        if (selectedMode === 'all') {
          stats = player.stats;
        } else {
          stats = player.stats[`stats${selectedMode}`];
          console.log(`Checking ${selectedMode}:`, {
            exists: !!stats,
            hasSessionsPlayed: stats?.sessionsPlayed !== undefined,
            sessionsValue: stats?.sessionsPlayed,
            fullStats: stats
          });
          if (!stats || stats.sessionsPlayed === undefined) {
            console.log(`No ${selectedMode} data yet - showing zeros`);
            stats = {
              sessionsPlayed: 0, sessionsWon: 0, sessionWinRate: 0,
              avgRankingPerSession: 0, avgRoundsPerSession: 0,
              longestSessionRounds: 0, recentRankings: []
            };
          }
        }

        const statsTitle = document.getElementById('statsTitle');
        if (statsTitle) {
          const modeLabel = { 'all': '全部模式 · ALL MODES', '4P': '4人模式 · 4P', '6P': '6人模式 · 6P', '8P': '8人模式 · 8P' }[selectedMode];
          statsTitle.textContent = modeLabel;
        }

        document.getElementById('statSessions').textContent = stats.sessionsPlayed || stats.gamesPlayed || 0;
        document.getElementById('statWins').textContent = stats.sessionsWon || stats.wins || 0;
        document.getElementById('statWinRate').textContent = ((stats.sessionWinRate || stats.winRate || 0) * 100).toFixed(1) + '%';

        if (selectedMode === 'all' && player.stats.modeBreakdown) {
          const modesPlayed = Object.values(player.stats.modeBreakdown || {}).filter(c => c > 0).length;
          if (modesPlayed > 1) {
            document.getElementById('statAvgRank').textContent = '混合';
            document.getElementById('statAvgRankRound').textContent = '混合';
          } else {
            document.getElementById('statAvgRank').textContent = (stats.avgRankingPerSession || stats.avgRanking || 0).toFixed(2);
            document.getElementById('statAvgRankRound').textContent = (stats.avgRankingPerRound || 0).toFixed(2);
          }
        } else {
          document.getElementById('statAvgRank').textContent = (stats.avgRankingPerSession || stats.avgRanking || 0).toFixed(2);
          document.getElementById('statAvgRankRound').textContent = (stats.avgRankingPerRound || 0).toFixed(2);
        }

        document.getElementById('statAvgRounds').textContent = selectedMode === 'all'
          ? Math.round(stats.avgRoundsPerSession || 30)
          : Math.round(stats.avgRoundsPerSession || 0);
        document.getElementById('statLongestRounds').textContent = stats.longestSessionRounds || 0;
        document.getElementById('statCurrentStreak').textContent = stats.currentWinStreak || 0;
        document.getElementById('statRounds').textContent = stats.roundsPlayed || 0;
        document.getElementById('statWinStreak').textContent = stats.longestWinStreak || 0;
        document.getElementById('statTotalTime').textContent = formatDuration(stats.totalPlayTimeSeconds || 0);
        document.getElementById('statLongestTime').textContent = formatDuration(stats.longestSessionSeconds || 0);
        document.getElementById('statAvgTime').textContent = formatDuration(stats.avgSessionSeconds || 0);

        const chartContainer = document.getElementById('recentRankingsChart')?.closest('.chart-wrap');
        if (stats.recentRankings && stats.recentRankings.length > 0) {
          if (chartContainer) chartContainer.style.display = 'block';
          renderRecentRankingsChart(stats.recentRankings);
        } else {
          if (chartContainer) chartContainer.style.display = 'none';
        }

        console.log(`Switched to ${selectedMode} mode:`, stats);
      });
    });

  } catch (error) {
    console.error('Failed to load profile:', error);
    document.getElementById('profileContent').innerHTML = `
      <div class="card" style="text-align:center;padding:var(--s8);">
        <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.18em;color:var(--loss);text-transform:uppercase;margin-bottom:var(--s4);">加载失败 · Load Error</div>
        <div style="font-family:var(--font-display);font-weight:900;font-size:28px;color:var(--ink);margin-bottom:var(--s4);">无法加载玩家资料</div>
        <p style="color:var(--ink-dim);">${escapeHtml(error.message || '未知错误')}</p>
        <p style="margin-top:var(--s5);"><a href="/players.html" class="btn-primary" style="text-decoration:none;">浏览所有玩家</a></p>
      </div>
    `;
  }
}
</script>
</body>
</html>
