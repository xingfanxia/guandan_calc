<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玩家浏览器 - 掼蛋计分器</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="掼蛋计分器">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/src/style.css">
<style>
  /* Modern Tab Navigation */
  .nav-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
    padding: 6px;
    background: #1a1a1a;
    border-radius: 12px;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
  }
  
  .nav-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.2s;
    cursor: pointer;
  }
  
  .nav-tab:not(.active) {
    color: #888;
    background: transparent;
  }
  
  .nav-tab:not(.active):hover {
    color: #fff;
    background: #252525;
  }
  
  .nav-tab.active {
    color: #fff;
    background: #3b82f6;
  }
  
  .nav-tab-icon {
    font-size: 18px;
  }

  .player-card {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    transition: all 0.2s;
    cursor: pointer;
  }
  .player-card:hover {
    background: #252525;
    border-color: #444;
    transform: translateY(-2px);
  }
  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .stat-badge {
    display: inline-block;
    background: #2a2a2a;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.9em;
    margin: 2px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>👥 玩家浏览器</h1>

  <!-- Modern Navigation Tabs -->
  <div class="nav-tabs">
    <a href="/players.html" class="nav-tab active">
      <span class="nav-tab-icon">👥</span>
      <span>浏览玩家</span>
    </a>
    <a href="/rooms.html" class="nav-tab">
      <span class="nav-tab-icon">🏠</span>
      <span>浏览房间</span>
    </a>
    <a href="/" class="nav-tab">
      <span class="nav-tab-icon">🎮</span>
      <span>游戏</span>
    </a>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom: 16px;">
      <input
        type="text"
        id="searchInput"
        placeholder="搜索用户名或昵称..."
        style="flex: 1; padding: 12px; background: #0b0b0c; border: 1px solid #333; border-radius: 6px; margin-right: 8px;"
      />
      <button id="searchButton" style="padding: 12px 24px; background: #3b82f6; color: white;">搜索</button>
      <button id="createPlayerButton" style="padding: 12px 24px; background: #22c55e; color: white; margin-left: 8px;">创建新玩家</button>
      <button id="adminModeButton" style="padding: 12px 24px; background: #ef4444; color: white; margin-left: 8px;">🔒 管理模式</button>
    </div>

    <!-- Admin token input (hidden by default) -->
    <div id="adminTokenContainer" style="margin-bottom: 16px; display: none;">
      <div style="background: #2a1a1a; border: 1px solid #ef4444; padding: 12px; border-radius: 6px;">
        <label style="display: block; margin-bottom: 6px; color: #ef4444; font-weight: bold;">⚠️ 管理员密码</label>
        <input
          type="password"
          id="adminTokenInput"
          placeholder="输入管理员密码..."
          style="width: 100%; padding: 8px 12px; background: #0b0b0c; border: 1px solid #ef4444; border-radius: 6px; color: white;"
        />
        <div style="color: #888; font-size: 0.85em; margin-top: 6px;">
          管理模式可以删除玩家或重置统计数据
        </div>
      </div>
    </div>

    <div style="color: #888; font-size: 0.9em; margin-bottom: 16px;">
      <span id="playerCount">加载中...</span>
    </div>

    <div id="playersList" class="player-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">
        加载中...
      </div>
    </div>

    <div id="pagination" style="margin-top: 20px; text-align: center; display: none;">
      <button id="prevPage" style="margin-right: 8px;" disabled>← 上一页</button>
      <span id="pageInfo" style="color: #888; margin: 0 16px;"></span>
      <button id="nextPage" disabled>下一页 →</button>
    </div>
  </div>
</div>

<script type="module">
import { searchPlayers, getPlayStyleLabel } from '/src/api/playerApi.js';
import { initializeCreateModal, showCreateModal } from '/src/player/playerCreateModal.js';
import { renderProfileAvatar } from '/src/player/photoRenderer.js';
import { escapeHtml } from '/src/core/utils.js';

let currentPage = 0;
const pageSize = 20;
let allPlayers = [];
let filteredPlayers = [];
let isAdminMode = false;
let adminToken = '';

// Initialize create modal
initializeCreateModal((createdPlayer) => {
  console.log('Player created:', createdPlayer);
  // Reload players list
  loadPlayers();
});

// Admin mode toggle
const adminModeButton = document.getElementById('adminModeButton');
const adminTokenContainer = document.getElementById('adminTokenContainer');
const adminTokenInput = document.getElementById('adminTokenInput');

if (adminModeButton) {
  adminModeButton.addEventListener('click', () => {
    isAdminMode = !isAdminMode;
    
    if (isAdminMode) {
      adminTokenContainer.style.display = 'block';
      adminModeButton.textContent = '🔓 退出管理';
      adminModeButton.style.background = '#f59e0b';
    } else {
      adminTokenContainer.style.display = 'none';
      adminModeButton.textContent = '🔒 管理模式';
      adminModeButton.style.background = '#ef4444';
      adminToken = '';
      if (adminTokenInput) adminTokenInput.value = '';
    }
    
    // Re-render players to show/hide admin buttons
    renderPlayers();
  });
}

if (adminTokenInput) {
  adminTokenInput.addEventListener('input', (e) => {
    adminToken = e.target.value;

    // SECURITY: client-side token validation removed — comparing against a hardcoded
    // value here leaked the password to anyone viewing source. The server validates
    // against the ADMIN_TOKEN env var on every admin endpoint; if wrong, the API
    // call rejects with 403 and the user sees the error from the action handler.
    //
    // UI here just signals "token entered" (neutral) vs "empty" (no admin actions).
    // Confirmation that it's correct comes from the first successful admin API call.
    const container = document.getElementById('adminTokenContainer');
    const containerInner = container?.querySelector('div');
    const hasToken = adminToken.length > 0;
    const successMsg = container?.querySelector('.admin-success-msg');

    if (hasToken) {
      if (containerInner) {
        containerInner.style.borderColor = '#fbbf24';
        containerInner.style.background = '#2a2410';
      }
      adminTokenInput.style.borderColor = '#fbbf24';
      if (successMsg) successMsg.remove();
      // Re-render to show admin buttons (server will reject if token is wrong)
      renderPlayers();
    } else {
      if (containerInner) {
        containerInner.style.borderColor = '#333';
        containerInner.style.background = '';
      }
      adminTokenInput.style.borderColor = '';
      if (successMsg) successMsg.remove();
      renderPlayers();
    }
  });
}

async function loadPlayers(query = '') {
  try {
    const result = await searchPlayers(query, 100);
    allPlayers = result.players;
    filteredPlayers = allPlayers;

    document.getElementById('playerCount').textContent =
      `共 ${result.total} 位玩家${query ? ` (匹配 "${query}")` : ''}`;

    currentPage = 0;
    renderPlayers();
  } catch (error) {
    console.error('Failed to load players:', error);
    document.getElementById('playersList').innerHTML =
      '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #ef4444;">加载失败，请刷新重试</div>';
  }
}

function renderPlayers() {
  const container = document.getElementById('playersList');
  const start = currentPage * pageSize;
  const end = start + pageSize;
  const playersToShow = filteredPlayers.slice(start, end);

  if (playersToShow.length === 0) {
    container.innerHTML =
      '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">暂无玩家</div>';
    return;
  }

  container.innerHTML = playersToShow.map(player => `
    <div class="player-card" onclick="location.href='/player-profile.html?handle=${encodeURIComponent(player.handle)}'">
      <div style="display: flex; align-items: center; margin-bottom: 12px;">
        ${renderProfileAvatar(player, 64)}
        <div style="flex: 1;">
          <h3 style="margin: 0 0 4px 0; font-size: 24px;">${escapeHtml(player.displayName)}</h3>
          <div style="color: #888; font-size: 0.9em;">@${escapeHtml(player.handle)}</div>
        </div>
      </div>

      <div style="color: #888; margin-bottom: 8px; font-size: 0.9em;">
        ${getPlayStyleLabel(player.playStyle)}
      </div>

      <div style="font-style: italic; color: #fbbf24; margin-bottom: 12px; font-size: 0.95em;">
        "${escapeHtml(player.tagline)}"
      </div>

      <div>
        <span class="stat-badge">🎮 ${player.stats.sessionsPlayed || player.stats.gamesPlayed || 0} 场</span>
        <span class="stat-badge">🏆 ${player.stats.sessionsWon || player.stats.wins || 0} 胜</span>
        <span class="stat-badge">📊 胜率 ${((player.stats.sessionWinRate || player.stats.winRate || 0) * 100).toFixed(1)}%</span>
        <span class="stat-badge">📈 场均 ${(player.stats.avgRankingPerSession || player.stats.avgRanking || 0).toFixed(2)} 名</span>
      </div>

      ${isAdminMode ? `
        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; display: flex; gap: 8px;">
          <button 
            onclick="event.stopPropagation(); resetPlayerStats('${player.handle}')"
            style="flex: 1; padding: 8px; background: #f59e0b; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em;">
            🔄 重置统计
          </button>
          <button 
            onclick="event.stopPropagation(); deletePlayer('${player.handle}')"
            style="flex: 1; padding: 8px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em;">
            🗑️ 删除玩家
          </button>
        </div>
      ` : ''}
    </div>
  `).join('');

  // Update pagination
  updatePagination();
}

function updatePagination() {
  const totalPages = Math.ceil(filteredPlayers.length / pageSize);
  const pagination = document.getElementById('pagination');
  const prevBtn = document.getElementById('prevPage');
  const nextBtn = document.getElementById('nextPage');
  const pageInfo = document.getElementById('pageInfo');

  if (totalPages <= 1) {
    pagination.style.display = 'none';
    return;
  }

  pagination.style.display = 'block';
  pageInfo.textContent = `第 ${currentPage + 1} / ${totalPages} 页`;

  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage >= totalPages - 1;
}

// Event handlers
document.getElementById('searchButton').onclick = () => {
  const query = document.getElementById('searchInput').value;
  loadPlayers(query);
};

document.getElementById('createPlayerButton').onclick = () => {
  showCreateModal();
};

document.getElementById('searchInput').onkeypress = (e) => {
  if (e.key === 'Enter') {
    const query = document.getElementById('searchInput').value;
    loadPlayers(query);
  }
};

document.getElementById('prevPage').onclick = () => {
  if (currentPage > 0) {
    currentPage--;
    renderPlayers();
  }
};

document.getElementById('nextPage').onclick = () => {
  const totalPages = Math.ceil(filteredPlayers.length / pageSize);
  if (currentPage < totalPages - 1) {
    currentPage++;
    renderPlayers();
  }
};

// Admin functions (global for onclick handlers)
window.deletePlayer = async function(handle) {
  if (!adminToken) {
    alert('请先输入管理员密码');
    return;
  }

  if (!confirm(`确定要删除玩家 @${handle} 吗？\n\n此操作不可恢复！`)) {
    return;
  }

  try {
    const response = await fetch('/api/players/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handle, adminToken })
    });

    const result = await response.json();

    if (result.success) {
      alert(`✅ 已删除玩家 @${handle}`);
      loadPlayers(); // Reload list
    } else {
      alert(`❌ 删除失败: ${result.error}`);
    }
  } catch (error) {
    console.error('Delete error:', error);
    alert('删除失败，请检查网络连接');
  }
};

window.resetPlayerStats = async function(handle) {
  if (!adminToken) {
    alert('请先输入管理员密码');
    return;
  }

  if (!confirm(`确定要重置 @${handle} 的所有统计数据吗？\n\n游戏记录、荣誉、成就等将全部清空！`)) {
    return;
  }

  try {
    const response = await fetch('/api/players/reset-stats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handle, adminToken })
    });

    const result = await response.json();

    if (result.success) {
      alert(`✅ 已重置 @${handle} 的统计数据`);
      loadPlayers(); // Reload list
    } else {
      alert(`❌ 重置失败: ${result.error}`);
    }
  } catch (error) {
    console.error('Reset error:', error);
    alert('重置失败，请检查网络连接');
  }
};

// Load on page load
loadPlayers();
</script>
</body>
</html>
