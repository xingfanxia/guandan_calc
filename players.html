<!DOCTYPE html>
<html lang="zh-CN" data-theme="broadcast">
<head>
<script>
  // Theme bootstrap — must be inline + synchronous + ABOVE stylesheets so
  // the cascade resolves with the user's chosen theme on first paint, not
  // with `data-theme="broadcast"` (the static fallback). Saved value list
  // is the source of truth for valid theme names; sync with main.js.
  try { var t = localStorage.getItem('gd_v9_theme');
    if (t && ['broadcast','linear','trading','atelier','teatable'].indexOf(t) !== -1)
      document.documentElement.setAttribute('data-theme', t);
  } catch(e) {}
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玩家浏览器 · GD LIVE BROADCAST</title>
<meta name="theme-color" content="#1c1f29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="掼蛋计分器">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">

<!-- Theme: Broadcast Editorial. Fonts match index.html exactly. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="/src/style.css">
<link rel="stylesheet" href="/src/themes/broadcast/theme.css">
<link rel="stylesheet" href="/src/themes/linear/theme.css">
<link rel="stylesheet" href="/src/themes/trading/theme.css">
<link rel="stylesheet" href="/src/themes/atelier/theme.css">
<link rel="stylesheet" href="/src/themes/teatable/theme.css">

</head>
<body>

<!-- TOP NAVIGATION -->
<nav class="topnav" aria-label="主导航">
  <div class="container topnav__inner">
    <div class="topnav__brand">
      <div class="topnav__brand-mark">A</div>
      <span class="topnav__brand-text">GD&nbsp;LIVE<span class="topnav__brand-version">BROADCAST · v10</span></span>
    </div>
    <div class="topnav__tabs">
      <a class="topnav__tab" href="/">
        <span class="topnav__tab-cn">游戏</span>
        <span class="topnav__tab-meta">GAME</span>
      </a>
      <a class="topnav__tab topnav__tab--active" href="/players.html" aria-current="page">
        <span class="topnav__tab-cn">玩家</span>
        <span class="topnav__tab-meta">PLAYERS</span>
      </a>
      <a class="topnav__tab" href="/rooms.html">
        <span class="topnav__tab-cn">房间</span>
        <span class="topnav__tab-meta">ROOMS</span>
      </a>
    </div>
    <div class="topnav__user">
      <div class="topnav__user-avatar">玩</div>
      <div class="topnav__user-meta">
        <span class="topnav__user-name">访客</span>
        <span class="topnav__user-handle">@guest</span>
      </div>
    </div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="container wrap">

  <!-- PAGE HEADING -->
  <div class="section-rule">
    <span class="section-rule__bar"></span>
    <span class="section-rule__label">玩家浏览器 · Player Registry</span>
    <span class="section-rule__line"></span>
    <span class="section-rule__meta">CAREER STATS · COMMUNITY PROFILES</span>
  </div>

  <!-- SEARCH BLOCK -->
  <div class="search-block">
    <div class="row">
      <input
        type="text"
        id="searchInput"
        placeholder="搜索用户名或昵称..."
        class="search-block__input"
      />
      <button id="searchButton" class="btn-primary">搜索</button>
      <button id="createPlayerButton" class="btn-secondary">创建玩家</button>
      <button id="adminModeButton" class="btn-danger">🔒 管理模式</button>
    </div>
  </div>

  <!-- Admin token panel (JS shows/hides) -->
  <div id="adminTokenContainer" style="display: none;">
    <div class="admin-panel">
      <label class="admin-panel__label" for="adminTokenInput">⚠ 管理员密码</label>
      <input
        type="password"
        id="adminTokenInput"
        class="admin-panel__input"
        placeholder="输入管理员密码..."
        autocomplete="current-password"
      />
      <p class="admin-panel__hint">管理模式可删除玩家或重置统计数据。密码由服务端验证。</p>
    </div>
  </div>

  <!-- ALL PLAYERS -->
  <div class="section-rule">
    <span class="section-rule__bar"></span>
    <span class="section-rule__label">全部玩家 · All Players</span>
    <span class="section-rule__line"></span>
    <span class="section-rule__meta" id="playerCount">加载中...</span>
  </div>

  <div id="playersList" class="players-grid">
    <div class="players-empty">加载中...</div>
  </div>

  <!-- PAGINATION -->
  <div id="pagination" class="players-pagination" style="display: none;">
    <button id="prevPage" class="btn-tertiary" disabled>← 上一页</button>
    <span id="pageInfo" class="players-pagination__info"></span>
    <button id="nextPage" class="btn-tertiary" disabled>下一页 →</button>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__brand">GD&nbsp;LIVE · BROADCAST EDITORIAL · v10</div>
    <div class="footer__meta">
      <a href="https://github.com/xingfanxia/guandan_calc" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:none;">GITHUB</a>
      · MADE WITH ❤️ BY XINGFAN XIA
    </div>
  </footer>

</main>

<script type="module">
import { searchPlayers, getPlayStyleLabel } from '/src/api/playerApi.js';
import { initializeCreateModal, showCreateModal } from '/src/player/playerCreateModal.js';
import { renderProfileAvatar } from '/src/player/photoRenderer.js';
import { escapeHtml } from '/src/core/utils.js';

let currentPage = 0;
const pageSize = 20;
let allPlayers = [];
let filteredPlayers = [];
let isAdminMode = false;
let adminToken = '';

// Initialize create modal
initializeCreateModal((createdPlayer) => {
  console.log('Player created:', createdPlayer);
  // Reload players list
  loadPlayers();
});

// Admin mode toggle
const adminModeButton = document.getElementById('adminModeButton');
const adminTokenContainer = document.getElementById('adminTokenContainer');
const adminTokenInput = document.getElementById('adminTokenInput');

if (adminModeButton) {
  adminModeButton.addEventListener('click', () => {
    isAdminMode = !isAdminMode;

    if (isAdminMode) {
      adminTokenContainer.style.display = 'block';
      adminModeButton.textContent = '🔓 退出管理';
      adminModeButton.classList.remove('btn-danger');
      adminModeButton.classList.add('btn-accent');
    } else {
      adminTokenContainer.style.display = 'none';
      adminModeButton.textContent = '🔒 管理模式';
      adminModeButton.classList.remove('btn-accent');
      adminModeButton.classList.add('btn-danger');
      adminToken = '';
      if (adminTokenInput) adminTokenInput.value = '';
    }

    // Re-render players to show/hide admin buttons
    renderPlayers();
  });
}

if (adminTokenInput) {
  adminTokenInput.addEventListener('input', (e) => {
    adminToken = e.target.value;

    // SECURITY: client-side token validation removed — comparing against a hardcoded
    // value here leaked the password to anyone viewing source. The server validates
    // against the ADMIN_TOKEN env var on every admin endpoint; if wrong, the API
    // call rejects with 403 and the user sees the error from the action handler.
    //
    // UI here just signals "token entered" (neutral) vs "empty" (no admin actions).
    // Confirmation that it's correct comes from the first successful admin API call.
    const container = document.getElementById('adminTokenContainer');
    const hasToken = adminToken.length > 0;
    const successMsg = container?.querySelector('.admin-success-msg');

    if (successMsg) successMsg.remove();
    // Re-render to show/hide admin buttons (server will reject if token is wrong)
    renderPlayers();
  });
}

async function loadPlayers(query = '') {
  try {
    const result = await searchPlayers(query, 100);
    allPlayers = result.players;
    filteredPlayers = allPlayers;

    document.getElementById('playerCount').textContent =
      `共 ${result.total} 位玩家${query ? ` · 匹配 "${query}"` : ''}`;

    currentPage = 0;
    renderPlayers();
  } catch (error) {
    console.error('Failed to load players:', error);
    document.getElementById('playersList').innerHTML =
      '<div class="players-empty" style="color: var(--danger, #e05252);">加载失败，请刷新重试</div>';
  }
}

function renderPlayers() {
  const container = document.getElementById('playersList');
  const start = currentPage * pageSize;
  const end = start + pageSize;
  const playersToShow = filteredPlayers.slice(start, end);

  if (playersToShow.length === 0) {
    container.innerHTML = '<div class="players-empty">暂无玩家</div>';
    return;
  }

  container.innerHTML = playersToShow.map(player => `
    <div class="player-card" onclick="location.href='/player-profile.html?handle=${encodeURIComponent(player.handle)}'">
      <div class="player-card__head">
        <div class="player-card__avatar-wrap">
          ${renderProfileAvatar(player, 56)}
        </div>
        <div class="player-card__identity">
          <h3 class="player-card__name">${escapeHtml(player.displayName)}</h3>
          <div class="player-card__handle">@${escapeHtml(player.handle)}</div>
        </div>
      </div>

      ${player.tagline ? `<p class="player-card__tagline">${escapeHtml(player.tagline)}</p>` : ''}

      <div class="player-card__stats">
        <span class="stat-badge">🎮 ${player.stats.sessionsPlayed || player.stats.gamesPlayed || 0} 场</span>
        <span class="stat-badge">🏆 ${player.stats.sessionsWon || player.stats.wins || 0} 胜</span>
        <span class="stat-badge">胜率 ${((player.stats.sessionWinRate || player.stats.winRate || 0) * 100).toFixed(1)}%</span>
        <span class="stat-badge">场均 ${(player.stats.avgRankingPerSession || player.stats.avgRanking || 0).toFixed(2)} 名</span>
      </div>

      ${isAdminMode && adminToken ? `
        <div class="player-card__admin" onclick="event.stopPropagation()">
          <button
            class="player-card__admin-btn player-card__admin-btn--reset"
            onclick="event.stopPropagation(); resetPlayerStats('${player.handle}')">
            🔄 重置统计
          </button>
          <button
            class="player-card__admin-btn player-card__admin-btn--delete"
            onclick="event.stopPropagation(); deletePlayer('${player.handle}')">
            🗑️ 删除玩家
          </button>
        </div>
      ` : ''}
    </div>
  `).join('');

  // Update pagination
  updatePagination();
}

function updatePagination() {
  const totalPages = Math.ceil(filteredPlayers.length / pageSize);
  const pagination = document.getElementById('pagination');
  const prevBtn = document.getElementById('prevPage');
  const nextBtn = document.getElementById('nextPage');
  const pageInfo = document.getElementById('pageInfo');

  if (totalPages <= 1) {
    pagination.style.display = 'none';
    return;
  }

  pagination.style.display = 'flex';
  pageInfo.textContent = `第 ${currentPage + 1} / ${totalPages} 页`;

  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage >= totalPages - 1;
}

// Event handlers
document.getElementById('searchButton').onclick = () => {
  const query = document.getElementById('searchInput').value;
  loadPlayers(query);
};

document.getElementById('createPlayerButton').onclick = () => {
  showCreateModal();
};

document.getElementById('searchInput').onkeypress = (e) => {
  if (e.key === 'Enter') {
    const query = document.getElementById('searchInput').value;
    loadPlayers(query);
  }
};

document.getElementById('prevPage').onclick = () => {
  if (currentPage > 0) {
    currentPage--;
    renderPlayers();
  }
};

document.getElementById('nextPage').onclick = () => {
  const totalPages = Math.ceil(filteredPlayers.length / pageSize);
  if (currentPage < totalPages - 1) {
    currentPage++;
    renderPlayers();
  }
};

// Admin functions (global for onclick handlers)
window.deletePlayer = async function(handle) {
  if (!adminToken) {
    alert('请先输入管理员密码');
    return;
  }

  if (!confirm(`确定要删除玩家 @${handle} 吗？\n\n此操作不可恢复！`)) {
    return;
  }

  try {
    const response = await fetch('/api/players/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handle, adminToken })
    });

    const result = await response.json();

    if (result.success) {
      alert(`✅ 已删除玩家 @${handle}`);
      loadPlayers(); // Reload list
    } else {
      alert(`❌ 删除失败: ${result.error}`);
    }
  } catch (error) {
    console.error('Delete error:', error);
    alert('删除失败，请检查网络连接');
  }
};

window.resetPlayerStats = async function(handle) {
  if (!adminToken) {
    alert('请先输入管理员密码');
    return;
  }

  if (!confirm(`确定要重置 @${handle} 的所有统计数据吗？\n\n游戏记录、荣誉、成就等将全部清空！`)) {
    return;
  }

  try {
    const response = await fetch('/api/players/reset-stats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handle, adminToken })
    });

    const result = await response.json();

    if (result.success) {
      alert(`✅ 已重置 @${handle} 的统计数据`);
      loadPlayers(); // Reload list
    } else {
      alert(`❌ 重置失败: ${result.error}`);
    }
  } catch (error) {
    console.error('Reset error:', error);
    alert('重置失败，请检查网络连接');
  }
};

// Load on page load
loadPlayers();
</script>
</body>
</html>
