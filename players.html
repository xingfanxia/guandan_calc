<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
  // Theme bootstrap — inline + synchronous + ABOVE stylesheets. Values:
  // 'light' | 'dark' (gd_v9_theme); anything else follows the system
  // preference. Sync with src/ui/themeToggle.js.
  (function () {
    var t = null;
    try { t = localStorage.getItem('gd_v9_theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玩家 · 闹掼计分器</title>
<meta name="theme-color" content="#15694B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="掼蛋计分器">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">

<!-- Design system: root DESIGN.md. System font stack — no webfonts. -->
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<!-- TOP NAVIGATION -->
<nav class="topnav" aria-label="主导航">
  <div class="container topnav__inner">
    <div class="topnav__brand">
      <div class="topnav__brand-mark">掼</div>
      <span class="topnav__brand-text">闹掼计分<span class="topnav__brand-version">v10</span></span>
    </div>
    <div class="topnav__tabs">
      <a class="topnav__tab" href="/">
        <span class="topnav__tab-cn">计分</span>
      </a>
      <a class="topnav__tab topnav__tab--active" href="/players.html" aria-current="page">
        <span class="topnav__tab-cn">玩家</span>
      </a>
      <a class="topnav__tab" href="/rooms.html">
        <span class="topnav__tab-cn">房间</span>
      </a>
    </div>
    <div id="themeToggleMount" class="topnav__picker"></div>
  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="container wrap wrap--wide">

  <!-- PAGE HEADING -->
  <div class="section-rule">
    <span class="section-rule__bar"></span>
    <span class="section-rule__label">玩家</span>
    <span class="section-rule__line"></span>
    <span class="section-rule__meta"></span>
  </div>

  <!-- SEARCH BLOCK -->
  <div class="search-block">
    <div class="row">
      <input
        type="text"
        id="searchInput"
        placeholder="搜索用户名或昵称..."
        class="search-block__input"
      />
      <button id="searchButton" class="btn-primary">搜索</button>
      <button id="createPlayerButton" class="btn-secondary">创建玩家</button>
      <button id="adminModeButton" class="btn-danger">🔒 管理模式</button>
    </div>
    <div class="sort-toggle" role="tablist" aria-label="排序方式">
      <button id="sortLadder" type="button" class="sort-toggle__btn sort-toggle__btn--active" role="tab" aria-selected="true">🏆 天梯榜</button>
      <button id="sortRecent" type="button" class="sort-toggle__btn" role="tab" aria-selected="false">🕐 最近活跃</button>
    </div>
  </div>

  <!-- Admin token panel (JS shows/hides) -->
  <div id="adminTokenContainer" style="display: none;">
    <div class="admin-panel">
      <label class="admin-panel__label" for="adminTokenInput">⚠ 管理员密码</label>
      <input
        type="password"
        id="adminTokenInput"
        class="admin-panel__input"
        placeholder="输入管理员密码..."
        autocomplete="current-password"
      />
      <p class="admin-panel__hint">管理模式可删除玩家或重置统计数据。密码由服务端验证。</p>
    </div>
  </div>

  <!-- ALL PLAYERS -->
  <div class="section-rule">
    <span class="section-rule__bar"></span>
    <span class="section-rule__label">全部玩家</span>
    <span class="section-rule__line"></span>
    <span class="section-rule__meta" style="display:inline" id="playerCount">加载中...</span>
  </div>

  <div id="playersList" class="players-grid">
    <div class="players-empty">加载中...</div>
  </div>

  <!-- PAGINATION -->
  <div id="pagination" class="players-pagination" style="display: none;">
    <button id="prevPage" class="btn-tertiary" disabled>← 上一页</button>
    <span id="pageInfo" class="players-pagination__info"></span>
    <button id="nextPage" class="btn-tertiary" disabled>下一页 →</button>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__brand">闹掼计分 · v10</div>
    <div class="footer__meta">
      <a href="https://github.com/xingfanxia/guandan_calc" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:none;">GitHub</a>
      · Made by Xingfan Xia
    </div>
  </footer>

</main>

<script type="module">
import { searchPlayers, getPlayStyleLabel } from '/src/api/playerApi.js';
import { mountThemeToggle } from '/src/ui/themeToggle.js';
mountThemeToggle(document.getElementById('themeToggleMount'));
import { initializeCreateModal, showCreateModal } from '/src/player/playerCreateModal.js';
import { renderProfileAvatar } from '/src/player/photoRenderer.js';
import { escapeHtml } from '/src/core/utils.js';

let currentPage = 0;
const pageSize = 20;
let allPlayers = [];
let filteredPlayers = [];
let isAdminMode = false;
let adminToken = '';
let currentSort = 'ladder';   // players page defaults to the 天梯榜 leaderboard
let currentQuery = '';

function toFiniteNumber(value, fallback = 0) {
  const number = Number(value);
  return Number.isFinite(number) ? number : fallback;
}

function formatInteger(value, fallback = 0) {
  return String(Math.round(toFiniteNumber(value, fallback)));
}

function formatFixed(value, digits = 2, fallback = 0) {
  return toFiniteNumber(value, fallback).toFixed(digits);
}

function formatPercent(value, digits = 1) {
  return formatFixed(toFiniteNumber(value, 0) * 100, digits);
}

// Initialize create modal
initializeCreateModal((createdPlayer) => {
  console.log('Player created:', createdPlayer);
  // Reload players list
  loadPlayers();
});

// Admin mode toggle
const adminModeButton = document.getElementById('adminModeButton');
const adminTokenContainer = document.getElementById('adminTokenContainer');
const adminTokenInput = document.getElementById('adminTokenInput');

if (adminModeButton) {
  adminModeButton.addEventListener('click', () => {
    isAdminMode = !isAdminMode;

    if (isAdminMode) {
      adminTokenContainer.style.display = 'block';
      adminModeButton.textContent = '🔓 退出管理';
      adminModeButton.classList.remove('btn-danger');
      adminModeButton.classList.add('btn-accent');
    } else {
      adminTokenContainer.style.display = 'none';
      adminModeButton.textContent = '🔒 管理模式';
      adminModeButton.classList.remove('btn-accent');
      adminModeButton.classList.add('btn-danger');
      adminToken = '';
      if (adminTokenInput) adminTokenInput.value = '';
    }

    // Re-render players to show/hide admin buttons
    renderPlayers();
  });
}

if (adminTokenInput) {
  adminTokenInput.addEventListener('input', (e) => {
    adminToken = e.target.value;

    // SECURITY: client-side token validation removed — comparing against a hardcoded
    // value here leaked the password to anyone viewing source. The server validates
    // against the ADMIN_TOKEN env var on every admin endpoint; if wrong, the API
    // call rejects with 403 and the user sees the error from the action handler.
    //
    // UI here just signals "token entered" (neutral) vs "empty" (no admin actions).
    // Confirmation that it's correct comes from the first successful admin API call.
    const container = document.getElementById('adminTokenContainer');
    const hasToken = adminToken.length > 0;
    const successMsg = container?.querySelector('.admin-success-msg');

    if (successMsg) successMsg.remove();
    // Re-render to show/hide admin buttons (server will reject if token is wrong)
    renderPlayers();
  });
}

// Sort toggle: 天梯榜 (ladder leaderboard) vs 最近活跃 (recent activity)
const sortLadderBtn = document.getElementById('sortLadder');
const sortRecentBtn = document.getElementById('sortRecent');
function setSort(sort) {
  if (currentSort === sort) return;
  currentSort = sort;
  const ladderActive = sort === 'ladder';
  sortLadderBtn?.classList.toggle('sort-toggle__btn--active', ladderActive);
  sortRecentBtn?.classList.toggle('sort-toggle__btn--active', !ladderActive);
  sortLadderBtn?.setAttribute('aria-selected', String(ladderActive));
  sortRecentBtn?.setAttribute('aria-selected', String(!ladderActive));
  loadPlayers(currentQuery);
}
sortLadderBtn?.addEventListener('click', () => setSort('ladder'));
sortRecentBtn?.addEventListener('click', () => setSort('recent'));

async function loadPlayers(query = '') {
  try {
    currentQuery = query;
    const result = await searchPlayers(query, 100, currentSort);
    allPlayers = result.players;
    filteredPlayers = allPlayers;

    document.getElementById('playerCount').textContent =
      `共 ${result.total} 位玩家${query ? ` · 匹配 "${query}"` : ''}`;

    currentPage = 0;
    renderPlayers();
  } catch (error) {
    console.error('Failed to load players:', error);
    document.getElementById('playersList').innerHTML =
      '<div class="players-empty" style="color: var(--danger, #e05252);">加载失败，请刷新重试</div>';
  }
}

function renderPlayers() {
  const container = document.getElementById('playersList');
  const start = currentPage * pageSize;
  const end = start + pageSize;
  const playersToShow = filteredPlayers.slice(start, end);

  if (playersToShow.length === 0) {
    container.innerHTML = '<div class="players-empty">暂无玩家</div>';
    return;
  }

  container.innerHTML = playersToShow.map((player, i) => {
    const playerStats = player.stats || {};
    const ladder = playerStats.ladder || {};
    const ladderRanked = toFiniteNumber(ladder.sessions) > 0;
    // Server returns the list already sorted by rating, so the slice index is the
    // leaderboard position — shown only for ranked players in 天梯榜 mode.
    const rank = (currentSort === 'ladder' && ladderRanked) ? (start + i + 1) : null;
    const rankMedal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : (rank ? `#${rank}` : '');

    return `
      <div
        class="player-card"
        role="link"
        tabindex="0"
        data-profile-handle="${escapeHtml(player.handle)}"
      >
        <div class="player-card__head">
          ${rankMedal ? `<span class="player-card__rank${rank <= 3 ? ' player-card__rank--top' : ''}">${rankMedal}</span>` : ''}
          <div class="player-card__avatar-wrap">
            ${renderProfileAvatar(player, 56)}
          </div>
          <div class="player-card__identity">
            <h3 class="player-card__name">${escapeHtml(player.displayName)}</h3>
            <div class="player-card__handle">@${escapeHtml(player.handle)}</div>
          </div>
        </div>

        ${player.tagline ? `<p class="player-card__tagline">${escapeHtml(player.tagline)}</p>` : ''}

        <div class="player-card__stats">
          <span class="stat-badge stat-badge--ladder">🪜 天梯 ${ladderRanked ? formatInteger(ladder.rating) : '未上榜'}</span>
          <span class="stat-badge">🎮 ${formatInteger(playerStats.sessionsPlayed || playerStats.gamesPlayed, 0)} 场</span>
          <span class="stat-badge">🏆 ${formatInteger(playerStats.sessionsWon || playerStats.wins, 0)} 胜</span>
          <span class="stat-badge">胜率 ${formatPercent(playerStats.sessionWinRate || playerStats.winRate)}%</span>
          <span class="stat-badge">场均 ${formatFixed(playerStats.avgRankingPerSession || playerStats.avgRanking)} 名</span>
        </div>

        ${isAdminMode && adminToken ? `
          <div class="player-card__admin">
            <button
              type="button"
              class="player-card__admin-btn player-card__admin-btn--reset"
              data-admin-action="reset"
              data-player-handle="${escapeHtml(player.handle)}">
              🔄 重置统计
            </button>
            <button
              type="button"
              class="player-card__admin-btn player-card__admin-btn--delete"
              data-admin-action="delete"
              data-player-handle="${escapeHtml(player.handle)}">
              🗑️ 删除玩家
            </button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  // Update pagination
  updatePagination();
}

function updatePagination() {
  const totalPages = Math.ceil(filteredPlayers.length / pageSize);
  const pagination = document.getElementById('pagination');
  const prevBtn = document.getElementById('prevPage');
  const nextBtn = document.getElementById('nextPage');
  const pageInfo = document.getElementById('pageInfo');

  if (totalPages <= 1) {
    pagination.style.display = 'none';
    return;
  }

  pagination.style.display = 'flex';
  pageInfo.textContent = `第 ${currentPage + 1} / ${totalPages} 页`;

  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage >= totalPages - 1;
}

function openPlayerProfile(handle) {
  if (!handle) return;
  location.href = `/player-profile.html?handle=${encodeURIComponent(handle)}`;
}

const playersListElement = document.getElementById('playersList');

if (playersListElement) {
  playersListElement.addEventListener('click', (event) => {
    const adminButton = event.target.closest('[data-admin-action]');
    if (adminButton && playersListElement.contains(adminButton)) {
      event.preventDefault();
      event.stopPropagation();

      const handle = adminButton.dataset.playerHandle || '';
      if (adminButton.dataset.adminAction === 'reset') {
        window.resetPlayerStats(handle);
      } else if (adminButton.dataset.adminAction === 'delete') {
        window.deletePlayer(handle);
      }
      return;
    }

    const card = event.target.closest('[data-profile-handle]');
    if (card && playersListElement.contains(card)) {
      openPlayerProfile(card.dataset.profileHandle || '');
    }
  });

  playersListElement.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    if (event.target.closest('[data-admin-action]')) return;

    const card = event.target.closest('[data-profile-handle]');
    if (!card || !playersListElement.contains(card)) return;

    event.preventDefault();
    openPlayerProfile(card.dataset.profileHandle || '');
  });
}

// Event handlers
document.getElementById('searchButton').onclick = () => {
  const query = document.getElementById('searchInput').value;
  loadPlayers(query);
};

document.getElementById('createPlayerButton').onclick = () => {
  showCreateModal();
};

document.getElementById('searchInput').onkeypress = (e) => {
  if (e.key === 'Enter') {
    const query = document.getElementById('searchInput').value;
    loadPlayers(query);
  }
};

document.getElementById('prevPage').onclick = () => {
  if (currentPage > 0) {
    currentPage--;
    renderPlayers();
  }
};

document.getElementById('nextPage').onclick = () => {
  const totalPages = Math.ceil(filteredPlayers.length / pageSize);
  if (currentPage < totalPages - 1) {
    currentPage++;
    renderPlayers();
  }
};

// Admin functions
window.deletePlayer = async function(handle) {
  if (!adminToken) {
    alert('请先输入管理员密码');
    return;
  }

  if (!confirm(`确定要删除玩家 @${handle} 吗？\n\n此操作不可恢复！`)) {
    return;
  }

  try {
    const response = await fetch('/api/players/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handle, adminToken })
    });

    const result = await response.json();

    if (result.success) {
      alert(`✅ 已删除玩家 @${handle}`);
      loadPlayers(); // Reload list
    } else {
      alert(`❌ 删除失败: ${result.error}`);
    }
  } catch (error) {
    console.error('Delete error:', error);
    alert('删除失败，请检查网络连接');
  }
};

window.resetPlayerStats = async function(handle) {
  if (!adminToken) {
    alert('请先输入管理员密码');
    return;
  }

  if (!confirm(`确定要重置 @${handle} 的所有统计数据吗？\n\n游戏记录、荣誉、成就等将全部清空！`)) {
    return;
  }

  try {
    const response = await fetch('/api/players/reset-stats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ handle, adminToken })
    });

    const result = await response.json();

    if (result.success) {
      alert(`✅ 已重置 @${handle} 的统计数据`);
      loadPlayers(); // Reload list
    } else {
      alert(`❌ 重置失败: ${result.error}`);
    }
  } catch (error) {
    console.error('Reset error:', error);
    alert('重置失败，请检查网络连接');
  }
};

// Load on page load
loadPlayers();
</script>
</body>
</html>
