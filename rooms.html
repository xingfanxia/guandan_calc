<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
  // Theme bootstrap — inline + synchronous + ABOVE stylesheets. Values:
  // 'light' | 'dark' (gd_v9_theme); anything else follows the system
  // preference. Sync with src/ui/themeToggle.js.
  (function () {
    var t = null;
    try { t = localStorage.getItem('gd_v9_theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>房间 · 闹掼计分器</title>

<meta name="theme-color" content="#15694B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="掼蛋计分器">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">

<!-- Design system: root DESIGN.md. System font stack — no webfonts. -->
<link rel="stylesheet" href="/src/styles/tokens.css">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<!-- TOP NAVIGATION -->
<nav class="topnav" aria-label="主导航">
  <div class="container topnav__inner">
    <div class="topnav__brand">
      <div class="topnav__brand-mark">掼</div>
      <span class="topnav__brand-text">闹掼计分<span class="topnav__brand-version">v10</span></span>
    </div>
    <div class="topnav__tabs">
      <a class="topnav__tab" href="/">
        <span class="topnav__tab-cn">计分</span>
      </a>
      <a class="topnav__tab" href="/players.html">
        <span class="topnav__tab-cn">玩家</span>
      </a>
      <a class="topnav__tab topnav__tab--active" href="/rooms.html" aria-current="page">
        <span class="topnav__tab-cn">房间</span>
      </a>
    </div>
    <div id="themeToggleMount" class="topnav__picker"></div>
  </div>
</nav>

<!-- STATUS STRIP -->
<div class="ticker">
  <div class="container ticker__inner">
    <div class="ticker__items">
      <div class="ticker__item">
        <span class="ticker__item-label">房间数</span>
        <span class="ticker__item-value ticker__item-value--accent" id="tickerRoomCount">—</span>
      </div>
      <div class="ticker__sep"></div>
      <div class="ticker__item">
        <span class="ticker__item-label">筛选</span>
        <span class="ticker__item-value" id="tickerFilter">全部</span>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<main class="container wrap wrap--wide">

  <!-- PAGE HEADING -->
  <div class="section-rule">
    <span class="section-rule__bar"></span>
    <span class="section-rule__label">活跃房间</span>
    <span class="section-rule__line"></span>
    <span class="section-rule__meta"></span>
  </div>

  <!-- FILTER ROW -->
  <div class="filter-row">
    <div class="filter-chips">
      <button class="filter-tab active" data-filter="all">全部房间</button>
      <button class="filter-tab" data-filter="favorites">★ 收藏</button>
    </div>
    <div class="filter-search">
      <input
        type="text"
        id="playerFilterInput"
        class="filter-search__input"
        placeholder="按玩家筛选 · @handle..."
      />
      <button id="filterButton" class="btn-secondary">筛选</button>
      <button id="clearFilterButton" class="btn-tertiary">清除</button>
    </div>
  </div>

  <!-- STATUS LINE -->
  <div class="rooms-status">
    <span id="roomCount">加载中…</span>
  </div>

  <!-- ROOMS GRID -->
  <div id="roomsList" class="rooms-grid">
    <div class="rooms-empty">
      <div class="rooms-empty__title">加载中…</div>
    </div>
  </div>

  <!-- PAGINATION -->
  <div id="pagination" style="display:none;">
    <div class="pagination-row">
      <button id="prevPage" class="btn-tertiary" disabled>← 上一页</button>
      <span id="pageInfo" class="pagination-row__info"></span>
      <button id="nextPage" class="btn-tertiary" disabled>下一页 →</button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__brand">闹掼计分 · v10</div>
    <div class="footer__meta">
      <a href="https://github.com/xingfanxia/guandan_calc" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:none;">GitHub</a>
      · Made by Xingfan Xia
    </div>
  </footer>

</main>

<script type="module">
import { mountThemeToggle } from '/src/ui/themeToggle.js';
mountThemeToggle(document.getElementById('themeToggleMount'));

let currentPage = 1;
let currentFilter = 'all';
let playerFilter = '';
let totalRooms = 0;
let hasNextPage = false;

function normalizeRoomCode(value) {
  const normalized = String(value || '').trim().toUpperCase();
  return /^[A-Z0-9]{6}$/.test(normalized) ? normalized : null;
}

function normalizeStringList(value) {
  if (!Array.isArray(value)) return [];
  return value
    .map(item => String(item || '').trim())
    .filter(Boolean);
}

function normalizeString(value) {
  return String(value || '').trim();
}

function formatRoomStatusText(room, isFinished) {
  const statusText = normalizeString(room.statusText);
  if (statusText) return statusText;

  if (!isFinished) return 'LIVE';
  const winnerName = normalizeString(room.winnerName);
  return winnerName ? winnerName + '通关' : 'FINISHED';
}

function formatNonNegativeInteger(value, fallback = 0) {
  const number = Number(value);
  if (!Number.isFinite(number) || number < 0) return fallback;
  return Math.round(number);
}

// Filter tab handling — querySelectorAll('.filter-tab') is the preserved JS selector
document.querySelectorAll('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    updateTickerFilter();
    currentPage = 1;
    loadRooms();
  });
});

// Player filter
document.getElementById('filterButton').addEventListener('click', () => {
  const input = document.getElementById('playerFilterInput').value.trim();
  playerFilter = input.replace('@', '');
  currentPage = 1;
  loadRooms();
});

document.getElementById('clearFilterButton').addEventListener('click', () => {
  document.getElementById('playerFilterInput').value = '';
  playerFilter = '';
  currentPage = 1;
  loadRooms();
});

document.getElementById('playerFilterInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    document.getElementById('filterButton').click();
  }
});

// Pagination
document.getElementById('prevPage').addEventListener('click', () => {
  if (currentPage > 1) {
    currentPage--;
    loadRooms();
  }
});

document.getElementById('nextPage').addEventListener('click', () => {
  if (hasNextPage) {
    currentPage++;
    loadRooms();
  }
});

function updateTickerFilter() {
  const el = document.getElementById('tickerFilter');
  if (!el) return;
  if (currentFilter === 'favorites') {
    el.textContent = '收藏';
  } else if (playerFilter) {
    el.textContent = '@' + playerFilter;
  } else {
    el.textContent = '全部';
  }
}

async function loadRooms() {
  try {
    const params = new URLSearchParams({
      page: currentPage.toString(),
      limit: '20'
    });
    if (currentFilter === 'favorites') params.set('favorites', 'true');
    if (playerFilter) params.set('player', playerFilter);

    const response = await fetch('/api/rooms/list?' + params);
    const result = await response.json();

    if (!result.success) {
      throw new Error(result.error || 'Failed to load rooms');
    }

    const rooms = Array.isArray(result.rooms) ? result.rooms : [];
    const pagination = result.pagination || {};
    totalRooms = formatNonNegativeInteger(pagination.total, rooms.length);
    hasNextPage = pagination.hasNext === true;

    const tickerCount = document.getElementById('tickerRoomCount');
    if (tickerCount) tickerCount.textContent = totalRooms;

    let countText = '共 ' + totalRooms + ' 个房间';
    if (playerFilter) countText += ' · 玩家: @' + playerFilter;
    if (currentFilter === 'favorites') countText += ' · 仅收藏';
    document.getElementById('roomCount').textContent = countText;

    const validCount = renderRooms(rooms);

    if (validCount < rooms.length) {
      const filtered = rooms.length - validCount;
      countText = '共 ' + validCount + ' 个有效房间';
      if (filtered > 0) countText += ' (已过滤 ' + filtered + ' 个无效房间)';
      if (playerFilter) countText += ' · 玩家: @' + playerFilter;
      if (currentFilter === 'favorites') countText += ' · 仅收藏';
      document.getElementById('roomCount').textContent = countText;
    }

    updatePagination();

  } catch (error) {
    console.error('Failed to load rooms:', error);
    const container = document.getElementById('roomsList');
    const div = document.createElement('div');
    div.className = 'rooms-empty';
    const title = document.createElement('div');
    title.className = 'rooms-empty__title';
    title.style.color = 'var(--team-red)';
    title.textContent = '加载失败';
    const sub = document.createElement('div');
    sub.className = 'rooms-empty__sub';
    sub.textContent = error.message;
    div.appendChild(title);
    div.appendChild(sub);
    container.replaceChildren(div);
  }
}

function buildRoomCard(room) {
  const normalizedRoomCode = normalizeRoomCode(room.roomCode);
  const isFinished = room.isFinished === true;
  const isFavorite = room.isFavorite === true;
  const dateStr = room.lastUpdated || room.createdAt;
  const teamNames = normalizeStringList(room.teamNames);
  const playerHandles = normalizeStringList(room.playerHandles);
  const playerCount = formatNonNegativeInteger(room.playerCount, playerHandles.length);
  const currentRound = formatNonNegativeInteger(room.currentRound, 0);
  const statusText = formatRoomStatusText(room, isFinished);

  // Outer card
  const card = document.createElement('div');
  card.className = 'room-card' + (isFavorite ? ' room-card--favorite' : '');
  card.addEventListener('click', () => joinRoom(normalizedRoomCode));

  // Room code
  const code = document.createElement('div');
  code.className = 'room-card__code num';
  code.textContent = normalizedRoomCode;
  card.appendChild(code);

  // Status row
  const statusRow = document.createElement('div');
  statusRow.className = 'room-card__status-row';

  const dot = document.createElement('div');
  dot.className = 'room-card__live-dot' + (isFinished ? ' room-card__live-dot--finished' : '');
  statusRow.appendChild(dot);

  const statusLabel = document.createElement('span');
  statusLabel.className = 'room-card__status-label' + (isFinished ? ' room-card__status-label--finished' : '');
  statusLabel.textContent = statusText;
  statusRow.appendChild(statusLabel);

  const roundSpan = document.createElement('span');
  roundSpan.className = 'room-card__round';
  roundSpan.textContent = '第 ' + currentRound + ' 局';
  statusRow.appendChild(roundSpan);
  card.appendChild(statusRow);

  // Meta
  const meta = document.createElement('div');
  meta.className = 'room-card__meta';

  if (teamNames.length > 0) {
    const row = document.createElement('div');
    row.className = 'room-card__meta-row';
    const key = document.createElement('span');
    key.className = 'room-card__meta-key';
    key.textContent = 'Teams';
    const val = document.createElement('span');
    val.textContent = teamNames.join(' vs ');
    row.appendChild(key);
    row.appendChild(val);
    meta.appendChild(row);
  }

  const playersRow = document.createElement('div');
  playersRow.className = 'room-card__meta-row';
  const playersKey = document.createElement('span');
  playersKey.className = 'room-card__meta-key';
  playersKey.textContent = 'Players';
  const playersVal = document.createElement('span');
  playersVal.textContent = playerCount + ' 人';
  playersRow.appendChild(playersKey);
  playersRow.appendChild(playersVal);
  meta.appendChild(playersRow);
  card.appendChild(meta);

  // Handles
  if (playerHandles.length > 0) {
    const handles = document.createElement('div');
    handles.className = 'room-card__handles';
    const shown = playerHandles.slice(0, 6);
    shown.forEach(h => {
      const chip = document.createElement('span');
      chip.className = 'room-card__handle';
      chip.textContent = '@' + h;
      handles.appendChild(chip);
    });
    if (playerHandles.length > 6) {
      const more = document.createElement('span');
      more.className = 'room-card__handle';
      more.textContent = '+' + (playerHandles.length - 6);
      handles.appendChild(more);
    }
    card.appendChild(handles);
  }

  // Footer
  const foot = document.createElement('div');
  foot.className = 'room-card__foot';

  const time = document.createElement('span');
  time.className = 'room-card__time';
  time.textContent = formatTime(dateStr);
  foot.appendChild(time);

  const btn = document.createElement('button');
  btn.className = isFinished ? 'btn-secondary' : 'btn-accent';
  btn.textContent = isFinished ? '查看' : '加入';
  btn.addEventListener('click', (e) => { e.stopPropagation(); joinRoom(normalizedRoomCode); });
  foot.appendChild(btn);

  card.appendChild(foot);
  return card;
}

function renderRooms(rooms) {
  const container = document.getElementById('roomsList');
  const roomList = Array.isArray(rooms) ? rooms : [];

  const validRooms = roomList.filter(room => {
    if (!normalizeRoomCode(room.roomCode)) return false;
    if (room.currentRound === undefined || room.currentRound === null) return false;
    if (!room.lastUpdated && !room.createdAt) return false;
    const date = new Date(room.lastUpdated || room.createdAt);
    if (isNaN(date.getTime())) return false;
    return true;
  });

  if (validRooms.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'rooms-empty';

    const title = document.createElement('div');
    title.className = 'rooms-empty__title';
    title.textContent = '暂无房间';

    const sub = document.createElement('div');
    sub.className = 'rooms-empty__sub';
    sub.textContent = playerFilter
      ? '没有找到匹配的房间'
      : 'No Active Rooms · Be The First To Start One';

    const cta = document.createElement('a');
    cta.href = '/';
    cta.className = 'btn-primary';
    cta.style.marginTop = 'var(--s3)';
    cta.textContent = '开始新游戏';

    empty.appendChild(title);
    empty.appendChild(sub);
    empty.appendChild(cta);
    container.replaceChildren(empty);
    return 0;
  }

  const fragment = document.createDocumentFragment();
  validRooms.forEach(room => fragment.appendChild(buildRoomCard(room)));
  container.replaceChildren(fragment);
  return validRooms.length;
}

function updatePagination() {
  const paginationDiv = document.getElementById('pagination');
  const prevBtn = document.getElementById('prevPage');
  const nextBtn = document.getElementById('nextPage');
  const pageInfo = document.getElementById('pageInfo');

  if (totalRooms === 0) {
    paginationDiv.style.display = 'none';
    return;
  }

  paginationDiv.style.display = 'block';
  prevBtn.disabled = currentPage === 1;
  nextBtn.disabled = !hasNextPage;
  pageInfo.textContent = '第 ' + currentPage + ' 页';
}

function formatTime(isoString) {
  const date = new Date(isoString);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return minutes + '分钟前';
  if (hours < 24) return hours + '小时前';
  if (days < 7) return days + '天前';
  return date.toLocaleDateString('zh-CN');
}

window.joinRoom = function(roomCode) {
  const normalizedRoomCode = normalizeRoomCode(roomCode);
  if (!normalizedRoomCode) return;
  window.location.href = '/?room=' + encodeURIComponent(normalizedRoomCode);
};

// Initial load
loadRooms();
</script>
</body>
</html>
