# Visual smoke — runs the capture suite + theme-toggle assertions on CI.
#
# Pixel comparison against the committed baselines is a LOCAL gate
# (`npm run test:visual`): the design system uses the system font stack, so
# macOS-generated baselines are not pixel-comparable with Linux renders.
# (The pre-2026-06 pixel-compare job was red for a month for exactly this
# class of cross-OS divergence.)
#
# What CI verifies instead:
#   1. test-theme-toggle.mjs — light/dark toggle, persistence, legacy-value
#      fallback, TOKEN_SPEC resolution in both modes, all 4 pages
#   2. capture-redesign.mjs + capture-png-exports.mjs run to completion with
#      ZERO page/console errors and produce the full expected PNG set —
#      catches broken imports, runtime errors, missing renders on Linux
#
# Trigger conditions are scoped to changes that can plausibly affect
# rendering. Avoid running on doc-only PRs since they can't change visuals.
#
# Security note: no `${{ github.event.* }}` inputs are interpolated into
# `run:` shell commands; the only ${{...}} used is `github.ref` for the
# concurrency group key (which is not passed to a shell).

name: visual-regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'index.html'
      - 'players.html'
      - 'rooms.html'
      - 'player-profile.html'
      - 'scripts/visual/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'index.html'
      - 'players.html'
      - 'rooms.html'
      - 'player-profile.html'
      - 'scripts/visual/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

# Cancel in-progress runs of this workflow for the same PR/branch.
concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers across runs — they're large (~150MB) and
      # don't change often. Cache key includes lockfile so an update auto-
      # invalidates.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit branch)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Capture scripts use Vite's dev-server module-graph (`import('/src/...')`
      # via page.evaluate), which only works against `npm run dev` — the
      # bundled production output exposes only /assets/*.js, not raw /src
      # paths. CI therefore runs the dev server, not preview.
      - name: Start dev server
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "dev server up after ${i}/60 polls"
              exit 0
            fi
            sleep 0.5
          done
          echo "dev server did not come up in 30s"
          cat /tmp/dev.log
          exit 1

      - name: Theme toggle smoke
        run: node scripts/visual/test-theme-toggle.mjs

      - name: Capture suite (structural smoke)
        run: |
          mkdir -p /tmp/visual-snapshot
          VISUAL_REPORT_BASE=/tmp/visual-snapshot node scripts/visual/capture-redesign.mjs
          VISUAL_REPORT_BASE=/tmp/visual-snapshot node scripts/visual/capture-png-exports.mjs

      - name: Verify capture set is complete
        run: |
          expected=21
          actual=$(find /tmp/visual-snapshot -name '*.png' | wc -l)
          echo "captured $actual PNGs (expected $expected)"
          if [ "$actual" -ne "$expected" ]; then
            find /tmp/visual-snapshot -name '*.png'
            exit 1
          fi

      # Always upload artifacts so runs leave inspectable PNGs.
      - name: Upload snapshot PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-snapshot
          path: /tmp/visual-snapshot/
          retention-days: 14
          if-no-files-found: warn

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then
            kill "$(cat /tmp/dev.pid)" 2>/dev/null || true
          fi
